<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Rewind V3 – Sonnen-Oase (Mall 1984)</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script><script src="lib/touchctl.js?v=1022z3"></script><script src="lib/helpmenu.js?v=1022o2"></script>
<script src="lib/adult.js?v=1022o2"></script><script src="lib/alpha.js?v=1022o2"></script><!-- Abstecher aus der Mall, Rückweg durch den Perlenvorhang -->
<script src="lib/dust.js?v=m1552"></script>
<script>window.OASE={ // Figur austauschbar (eine Stelle): GLB in Metern, liegt entlang x, Kopf bei −x, Ursprung = Liegefläche. Ab-18-Varianten optional: lieAdult/upAdult (werden nur bei ZS_ADULT geladen)
 fig:{lie:'../assets/oase/kundin_lie.glb?v=1', up:'../assets/oase/kundin_up.glb?v=1', lieAdult:'../assets/oase/kundin_lie_h8.glb?v=2', upAdult:'../assets/oase/kundin_up_h8.glb?v=2'},
 chestAdult:{x0:-0.539,x1:-0.379,zIn:0.012,zOut:0.207} };   // Ab-18-Figur liegt auf dem Rücken: Brust-Zone (keine Wirkung, nur Ohrfeigen-Gag)</script>
<script src="lib/oase3d.js?v=1023o8"></script>
<style>#sub{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:6;color:#fff;font:600 17px sans-serif;text-shadow:0 0 8px #000;background:rgba(0,0,0,.5);padding:6px 14px;border-radius:8px;display:none;max-width:80%;text-align:center}
#ff{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.5) 100%);mix-blend-mode:multiply}
#grain{position:fixed;inset:0;z-index:4;pointer-events:none;width:100%;height:100%;opacity:.07;image-rendering:pixelated}</style></head><body>
<div id="sub"></div>
<a-scene oase renderer="colorManagement:true; antialias:true; foveationLevel:0.2; toneMapping:ACESFilmic; exposure:1.05" webxr="referenceSpaceType:local-floor"
 fog="type:exponential; color:#140b08; density:0.06" background="color:#070404" light="defaultLightsEnabled:false" cursor="rayOrigin:mouse" raycaster="objects:.clickable">
 <a-entity id="rig" position="0.9 0 1.05">
  <a-camera id="cam" position="0 1.6 0" wasd-controls="acceleration:14"></a-camera>
  <a-entity id="hl" laser-controls="hand:left" raycaster="objects:.clickable; far:6; lineOpacity:0.2"></a-entity>
  <a-entity id="hr" laser-controls="hand:right" raycaster="objects:.clickable; far:6; lineOpacity:0.2"></a-entity>
 </a-entity>
</a-scene>
<div id="ff"></div><canvas id="grain" width="160" height="90"></canvas>
<script>(()=>{ if(/[?&]noff=1/.test(location.search)){ff.remove();grain.remove();return;} const c=grain,x=c.getContext('2d'),d=x.createImageData(160,90);
 const go=()=>{ for(let i=0;i<d.data.length;i+=4){ const v=Math.random()*255; d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255; } x.putImageData(d,0,0); setTimeout(()=>requestAnimationFrame(go),60); }; go();
 const s=document.querySelector('a-scene'); s.addEventListener('enter-vr',()=>{ff.style.display=grain.style.display='none';}); s.addEventListener('exit-vr',()=>{ff.style.display=grain.style.display='';}); })();</script>
</body></html>
