<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>tf2</title>
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
<style>#hud{position:fixed;left:8px;bottom:8px;color:#cbb;font:12px sans-serif;z-index:9;opacity:.7}</style>
</head><body>
<div id="hud">Maus ziehen = umsehen · WASD = gehen · VR: frei herumlaufen</div>
<a-scene renderer="colorManagement:true;foveationLevel:0;highRefreshRate:true" xr-mode-ui="enabled:true" background="color:#1c1714">
  <a-assets><a-asset-item id="m" src="assets/tf2_m.glb"></a-asset-item></a-assets>
  <a-plane rotation="-90 0 0" width="12" height="12" color="#2a221d" roughness="0.95"></a-plane>
  <a-box position="0 0.01 -2.4" width="1.6" depth="1.7" height="0.02" color="#140f0c" roughness="0.9"></a-box>
  <a-entity gltf-model="#m" position="0 0.02 -2.4"></a-entity>
  <a-entity light="type:ambient;color:#ffd9b8;intensity:0.7"></a-entity>
  <a-entity light="type:point;color:#ffb27a;intensity:5;distance:8;decay:1.5" position="0.8 2.3 -1.3"></a-entity>
  <a-entity light="type:point;color:#ff9a5c;intensity:0.8;distance:6;decay:1.5" position="-1.4 1.5 -3.0"></a-entity>
  <a-entity light="type:hemisphere;color:#5a463a;groundColor:#120d0a;intensity:0.4"></a-entity>
  <a-entity id="rig" position="0 0 0">
    <a-camera position="0 1.6 0" wasd-controls="acceleration:12"></a-camera>
    <a-entity hand-controls="hand:left"></a-entity><a-entity hand-controls="hand:right"></a-entity>
  </a-entity>
</a-scene>
</body></html>
