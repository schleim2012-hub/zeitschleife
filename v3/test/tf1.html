<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>tf1</title>
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
<style>#hud{position:fixed;left:8px;bottom:8px;color:#cbb;font:12px sans-serif;z-index:9;opacity:.7}</style>
</head><body>
<div id="hud">Maus ziehen = umsehen · WASD = gehen · VR-Brille: einfach etwas zur Seite treten</div>
<script>
// Depth-displaced photo mesh, fixed in world (not head-locked). Photo camera sits at eye height 1.5 m, z=0.
AFRAME.registerComponent('depth-photo',{
  schema:{img:{default:'assets/tf1_a.webp'},depth:{default:'assets/tf1_d.png'},
    fov:{default:52},near:{default:0.95},far:{default:2.9},eye:{default:1.5},segX:{default:160},segY:{default:240}},
  init(){
    const d=this.data, el=this.el, T=THREE;
    const di=new Image(); di.crossOrigin='anonymous';
    di.onload=()=>{
      const c=document.createElement('canvas'); c.width=di.width; c.height=di.height;
      const g=c.getContext('2d'); g.drawImage(di,0,0);
      const px=g.getImageData(0,0,c.width,c.height).data, W=c.width, H=c.height;
      const samp=(u,v)=>{ // bilinear
        const x=Math.min(W-1.001,Math.max(0,u*(W-1))), y=Math.min(H-1.001,Math.max(0,v*(H-1)));
        const x0=x|0,y0=y|0,fx=x-x0,fy=y-y0,i=(a,b)=>px[(b*W+a)*4]/255;
        return (i(x0,y0)*(1-fx)+i(x0+1,y0)*fx)*(1-fy)+(i(x0,y0+1)*(1-fx)+i(x0+1,y0+1)*fx)*fy;};
      const sx=d.segX, sy=d.segY, asp=W/H, th=Math.tan(d.fov*Math.PI/360);
      const pos=new Float32Array((sx+1)*(sy+1)*3), uv=new Float32Array((sx+1)*(sy+1)*2), Z=new Float32Array((sx+1)*(sy+1));
      // disparity -> distance: 1/z linear in disparity
      const a=1/d.near-1/d.far, b=1/d.far;
      for(let j=0;j<=sy;j++)for(let i=0;i<=sx;i++){
        const k=j*(sx+1)+i, u=i/sx, v=j/sy, disp=samp(u,v), z=1/(a*disp+b);
        const nx=(u*2-1)*th*asp, ny=(1-v*2)*th;
        pos[k*3]=nx*z; pos[k*3+1]=ny*z+d.eye; pos[k*3+2]=-z; Z[k]=z;
        uv[k*2]=u; uv[k*2+1]=1-v;}
      const idx=[];
      const ok=(p,q,r)=>{const m=Math.min(Z[p],Z[q],Z[r]),M=Math.max(Z[p],Z[q],Z[r]);return (M-m)/m<0.10;};
      for(let j=0;j<sy;j++)for(let i=0;i<sx;i++){
        const p=j*(sx+1)+i,q=p+1,r=p+sx+1,s=r+1;
        if(ok(p,r,q))idx.push(p,r,q); if(ok(q,r,s))idx.push(q,r,s);}
      const geo=new T.BufferGeometry();
      geo.setAttribute('position',new T.BufferAttribute(pos,3));
      geo.setAttribute('uv',new T.BufferAttribute(uv,2));
      geo.setIndex(idx);
      const tex=new T.TextureLoader().load(d.img,t=>{t.colorSpace=T.SRGBColorSpace;t.anisotropy=8;t.needsUpdate=true;});
            const mat=new T.MeshBasicMaterial({map:tex,side:T.DoubleSide});
      el.setObject3D('mesh',new T.Mesh(geo,mat));

    };
    di.src=d.depth;
  }});
</script>
<a-scene renderer="colorManagement:true;foveationLevel:0;highRefreshRate:true" xr-mode-ui="enabled:true" background="color:#1c1714">
  <a-entity depth-photo></a-entity>
  <a-plane rotation="-90 0 0" width="8" height="8" position="0 0 -1" color="#2a221d"></a-plane>
  <a-entity id="rig" position="0 0 0.15">
    <a-camera position="0 1.5 0" wasd-controls="acceleration:12"></a-camera>
    <a-entity hand-controls="hand:left"></a-entity><a-entity hand-controls="hand:right"></a-entity>
  </a-entity>
</a-scene>
</body></html>
