<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Rewind V3 – 1984 Zimmer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script><script src="lib/touchctl.js?v=1021t2"></script><script src="lib/helpmenu.js?v=1021t2"></script><script src="lib/alpha.js?v=m1546"></script>
<script src="../tv.js?v=5"></script><script src="lib/dust.js?v=m1552"></script><script src="lib/k84.js?v=1"></script>
<script src="lib/gfx_kinderzimmer.js?v=1"></script>
<style>#hud{position:fixed;left:12px;top:10px;z-index:5;color:#ffd6f0;font:600 14px/1.35 sans-serif;background:rgba(0,0,0,.5);padding:8px 12px;border-radius:10px;max-width:470px}
#sub{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:6;color:#fff;font:600 17px sans-serif;text-shadow:0 0 8px #000;background:rgba(0,0,0,.45);padding:6px 14px;border-radius:8px;display:none;max-width:80%}</style></head><body>
<div id="hud"><b>1984 · Zimmer</b><br>VR: L-Stick gehen · R-Stick drehen · Laser+Trigger = TV an/aus, Kanal, Gegenstand nehmen/ablegen<br>Desktop: WASD · Klick = TV / Gegenstand nehmen, Klick ins Leere = ablegen</div>
<div id="sub"></div>
<a-scene renderer="colorManagement:true; antialias:true; foveationLevel:0.2" webxr="referenceSpaceType:local-floor"
 fog="type:exponential; color:#07040a; density:0.04" background="color:#020103" light="defaultLightsEnabled:false" cursor="rayOrigin:mouse" raycaster="objects:.clickable">
 <a-entity id="tv" position="-0.75 0.62 -1.76" rotation="0 12 0" crt-tv="model:../assets/props/television_02.glb; base:../tv/; channels:ch01.mp4,ch02.mp4,ch03.mp4,ch04.mp4,ch05.mp4,ch06.mp4,ch07.mp4,ch08.mp4,ch09.mp4,ch10.mp4,ch11.mp4,ch12.mp4,ch13.mp4,live:nl/nl_%02d.mp4:8:720; scale:0.52"></a-entity>
 <a-entity id="rig" room-move>
  <a-camera id="cam" position="0 1.6 0" wasd-controls="acceleration:18"></a-camera>
  <a-entity id="hl" laser-controls="hand:left" raycaster="objects:.clickable; far:6"></a-entity>
  <a-entity id="hr" laser-controls="hand:right" raycaster="objects:.clickable; far:6"></a-entity>
 </a-entity>
</a-scene>
<script>
const T=THREE, S=document.querySelector('a-scene');
const BACKDROP='../assets/era1984/room_backdrop.jpg?v=3'; // Perchance e1984_room_1 (Pete); Platzhalter: ../assets/era1984/placeholder.jpg
const VOICE='../voice/';
const MARA={enter:'mara_1c118614fc.mp3', tv:'mara_05a784cf86.mp3', grab:'mara_ea27a247ba.mp3', odd:'mara_dc24b624ed.mp3', nope:'mara_bed5c765e6.mp3', look:'mara_1a29c41923.mp3'};
const SUB={enter:'„Süß. Aber die Uhr tickt, Casanova.“', tv:'„Du drehst da seit zwei Minuten dran. Süß. Aber sinnlos. Vielleicht verrät dir ja der Highscore was?“', grab:'„Was soll das werden, ein Kunstprojekt?“', odd:'„Süßer… das ist nicht, wie man das benutzt.“', nope:'„Haha, nein. Aber ich liebe deine Kreativität.“', look:'„Und jetzt? Schau nicht mich an!“'};
let maraBusy=false, saidOnce={};
function mara(k,once=true){ if(maraBusy||(once&&saidOnce[k])) return; saidOnce[k]=1; maraBusy=true; const a=new Audio(VOICE+MARA[k]); a.volume=0.9;
 const sb=document.getElementById('sub'); sb.textContent='Mara: '+SUB[k]; sb.style.display='block';
 a.onended=a.onerror=()=>{maraBusy=false; setTimeout(()=>sb.style.display='none',600);}; a.play().catch(()=>{maraBusy=false; setTimeout(()=>sb.style.display='none',3500);}); }
S.addEventListener('loaded',()=>{
 const G=S.object3D, TL=new T.TextureLoader();
 const tex=(u,cb)=>TL.load(u,t=>{t.colorSpace=T.SRGBColorSpace;t.anisotropy=8;cb&&cb(t);});
 const std=o=>new T.MeshStandardMaterial(o);
 const B84=window.__B84=build84(S);
 // ---------- grabbables: VHS (c1-c3), book (c4), cereal (c5) ----------
 const items=[];
 function item(n,w,h,d,x,y,z,ry,spine,page,flat){ const fm=std({color:0xffffff,roughness:0.6}); tex('../assets/era1984/'+n+'.jpg?v=2',t=>{fm.map=t;fm.needsUpdate=true;});
  const sm=std({color:spine,roughness:0.7}); const pm=page?std({color:page,roughness:0.9}):sm; const mats=[pm,sm,pm,pm,fm,sm];
  const el=document.createElement('a-entity'); el.classList.add('clickable'); S.appendChild(el);
  el.addEventListener('loaded',()=>{ const me=new T.Mesh(new T.BoxGeometry(w,h,d),mats); el.setObject3D('mesh',me); if(flat){ el.object3D.position.set(x,y+d/2,z); el.object3D.rotation.set(-Math.PI/2,0,0); el.object3D.rotateOnWorldAxis(new T.Vector3(0,1,0),ry); } else { el.object3D.position.set(x,y+h/2,z); el.object3D.rotation.y=ry; } });
  const it={el,n,h:flat?d:h,flat,home:new T.Vector3(x,y+h/2,z),vy:0,held:null}; items.push(it);
  el.addEventListener('click',e=>{ e.stopPropagation&&e.stopPropagation(); grab(it,e.detail&&e.detail.cursorEl); }); return it; }
 item('c1',0.105,0.19,0.025,-0.38,0,-1.82,0.25,0x111111); item('c2',0.15,0.22,0.035,-0.25,0,-1.8,0.1,0x3a1d12,0xcbbf9e); item('c3',0.19,0.27,0.006,-1.45,0.55,-0.55,-0.35,0xd8d0c0,0xd8d0c0,true);
 item('c4',0.15,0.22,0.035,1.85,1.13,-1.8,-0.1,0x5a2a1a); item('c5',0.19,0.28,0.07,1.7,0.76,-0.05,-0.4,0xd8c070);
 let held=null, grabs=0;
 function grab(it,src){ if(held&&held!==it) drop(); if(held===it){ drop(); return; }
  const hand=(src&&src.id&&src.id!=='')?src:null; const par=(hand&&(hand.id==='hl'||hand.id==='hr'))?hand.object3D:document.getElementById('cam').object3D;
  par.attach(it.el.object3D); if(par===document.getElementById('cam').object3D){ it.el.object3D.position.set(0.12,-0.18,-0.45); } else { it.el.object3D.position.set(0,0,-0.12); }
  it.el.object3D.rotation.set(-0.3,0,0); held=it; it.vy=0; grabs++; mara(grabs===1?'grab':(grabs===4?'odd':(grabs===7?'nope':'grab')), true); }
 function drop(){ if(!held) return; G.attach(held.el.object3D); if(held.flat) held.el.object3D.rotation.set(-Math.PI/2,0,held.el.object3D.rotation.z); else held.el.object3D.rotation.set(0,held.el.object3D.rotation.y,0); held.falling=true; held=null; }
 window.addEventListener('mousedown',e=>{ setTimeout(()=>{ if(held && !e.__used) {} },0); });
 S.addEventListener('click',e=>{ if(held && e.target===S) drop(); });
 ['hl','hr'].forEach(id=>document.getElementById(id).addEventListener('triggerdown',()=>{ const rc=document.getElementById(id).components.raycaster; if(held && (!rc||!rc.intersectedEls.length)) drop(); }));
 // surfaces for falling items
 const surf=B84.surf;
 AFRAME.registerComponent('era-tick',{tick(t,dt){ const d=Math.min(dt,50)/1000; items.forEach(it=>{ if(!it.falling) return; const o=it.el.object3D; it.vy-=9.8*d; o.position.y+=it.vy*d;
   let fy=0; surf.forEach(([x,z,w,dd,h])=>{ if(Math.abs(o.position.x-x)<w/2&&Math.abs(o.position.z-z)<dd/2) fy=Math.max(fy,h); });
   if(o.position.y<fy+it.h/2){ o.position.y=fy+it.h/2; it.vy=0; it.falling=false; } });
   }}); S.setAttribute('era-tick','');
 // Mara: enter + TV
 setTimeout(()=>mara('enter'),2500);
 document.getElementById('tv').addEventListener('click',()=>{ setTimeout(()=>mara('tv'),6000); });
 // (VR-Kopf-Rauschen entfernt) – stattdessen weltfester Staub
 if(window.worldDust) worldDust(S,{count:55,rMin:1.0,rMax:3.6,color:0xffe2b8,opacity:0.36});
});
// VR locomotion: left stick move, right stick snap 30°, clamp to room
window.zsSnapTurn=window.zsSnapTurn||function(rigO,s,sc){ /* Snap-Drehung um den KOPF (nicht um den Rig-Ursprung), sonst springt man seitlich weg */ const cam=(sc||document.querySelector('a-scene')).camera, a=new THREE.Vector3(), b=new THREE.Vector3(); cam.getWorldPosition(a); rigO.rotation.y-=s*Math.PI/6; rigO.updateMatrixWorld(true); cam.getWorldPosition(b); rigO.position.x+=a.x-b.x; rigO.position.z+=a.z-b.z; };
AFRAME.registerComponent('room-move',{init(){ this.ax=[0,0]; this.snap=0;
 const L=()=>document.getElementById('hl'), Rr=()=>document.getElementById('hr');
 setTimeout(()=>{ L().addEventListener('thumbstickmoved',e=>{this.ax=[e.detail.x,e.detail.y];}); Rr().addEventListener('thumbstickmoved',e=>{ const x=e.detail.x; if(Math.abs(x)>0.7&&!this.snap){ this.snap=1; zsSnapTurn(this.el.object3D,Math.sign(x),this.el.sceneEl); } if(Math.abs(x)<0.3) this.snap=0; }); },0); },
 tick(t,dt){ const o=this.el.object3D, d=Math.min(dt,50)/1000; const [x,y]=this.ax; if(Math.abs(x)>0.15||Math.abs(y)>0.15){ const cam=this.el.sceneEl.camera; const q=new THREE.Quaternion(); cam.getWorldQuaternion(q); const f=new THREE.Vector3(x,0,y).applyQuaternion(q); f.y=0; o.position.addScaledVector(f,1.4*d); }
  const hw=this.el.sceneEl.camera.getWorldPosition(new THREE.Vector3()); const wx=hw.x, wz=hw.z; if(!window.__B84) return; const p={x:wx,z:wz}; __B84.collide(p); o.position.x+=p.x-wx; o.position.z+=p.z-wz; }});
</script><script>window.ERAX={covers:[['c6','book',1.6,1.13,-1.8,-15,['Mara','„Tetris-Tante. Räumt jede Zeile ab. Nur nicht dein Zimmer.“']]],
 decoys:[['../assets/items/springmaus_plush.glb',-1.4,0.55,-1.35,1,200,['Mara','„Eine Springmaus? Zu früh, Süßer. Die kommt erst in neun Jahren. Leg sie hin, bevor sie quietscht.“']]]};</script>
<script src="era_amb.js?v=1"></script><script>eraAmbStart("../assets/sfx/amb_1984.mp3",0.3)</script><script src="era_extras.js?v=7"></script></body></html>
