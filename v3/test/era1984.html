<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Rewind V3 – 1984 Zimmer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
<script src="../tv.js?v=5"></script>
<style>#hud{position:fixed;left:12px;top:10px;z-index:5;color:#ffd6f0;font:600 14px/1.35 sans-serif;background:rgba(0,0,0,.5);padding:8px 12px;border-radius:10px;max-width:470px}
#sub{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:6;color:#fff;font:600 17px sans-serif;text-shadow:0 0 8px #000;background:rgba(0,0,0,.45);padding:6px 14px;border-radius:8px;display:none;max-width:80%}</style></head><body>
<div id="hud"><b>1984 · Zimmer</b><br>VR: L-Stick gehen · R-Stick drehen · Laser+Trigger = TV an/aus, Kanal, Gegenstand nehmen/ablegen<br>Desktop: WASD · Klick = TV / Gegenstand nehmen, Klick ins Leere = ablegen</div>
<div id="sub"></div>
<canvas id="ffgrain" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;opacity:.17;mix-blend-mode:overlay"></canvas>
<a-scene renderer="colorManagement:true; antialias:true; foveationLevel:0.2" webxr="referenceSpaceType:local-floor"
 fog="type:exponential; color:#1e0a1c; density:0.08" background="color:#05020a" cursor="rayOrigin:mouse" raycaster="objects:.clickable">
 <a-entity light="type:ambient; color:#5a3070; intensity:0.18"></a-entity>
 <a-entity light="type:point; color:#ff4fb0; intensity:2.2; distance:5; decay:2" position="0.6 2.2 -1.6"></a-entity>
 <a-entity light="type:point; color:#ff9a4c; intensity:1.6; distance:4; decay:2" position="-1.5 1.2 -1.4"></a-entity>
 <a-entity light="type:point; color:#7a5cff; intensity:0.8; distance:5; decay:2" position="0 2.4 1.2"></a-entity>
 <a-entity id="tv" position="0.28 0.72 -1.9" crt-tv="model:../assets/props/television_02.glb; base:../tv/; channels:ch01.mp4,ch02.mp4,ch03.mp4,ch04.mp4,ch05.mp4,ch06.mp4,ch07.mp4,ch08.mp4,ch09.mp4,ch10.mp4,ch11.mp4,ch12.mp4,ch13.mp4,live:nl/nl_%02d.mp4:8:720; scale:1.75"></a-entity>
 <a-entity id="rig" room-move>
  <a-camera id="cam" position="0 1.6 0" wasd-controls="acceleration:18"></a-camera>
  <a-entity id="hl" laser-controls="hand:left" raycaster="objects:.clickable; far:6"></a-entity>
  <a-entity id="hr" laser-controls="hand:right" raycaster="objects:.clickable; far:6"></a-entity>
 </a-entity>
</a-scene>
<script>
const T=THREE, S=document.querySelector('a-scene');
const BACKDROP='../assets/era1984/room_backdrop.jpg'; // Perchance e1984_room_1 (Pete); Platzhalter: ../assets/era1984/placeholder.jpg
const VOICE='../voice/';
const MARA={enter:'mara_1c118614fc.mp3', tv:'mara_05a784cf86.mp3', grab:'mara_ea27a247ba.mp3', odd:'mara_dc24b624ed.mp3', nope:'mara_bed5c765e6.mp3', look:'mara_1a29c41923.mp3'};
const SUB={enter:'„Süß. Aber die Uhr tickt, Casanova.“', tv:'„Du drehst da seit zwei Minuten dran. Süß. Aber sinnlos. Vielleicht verrät dir ja der Highscore was?“', grab:'„Was soll das werden, ein Kunstprojekt?“', odd:'„Süßer… das ist nicht, wie man das benutzt.“', nope:'„Haha, nein. Aber ich liebe deine Kreativität.“', look:'„Und jetzt? Schau nicht mich an!“'};
let maraBusy=false, saidOnce={};
function mara(k,once=true){ if(maraBusy||(once&&saidOnce[k])) return; saidOnce[k]=1; maraBusy=true; const a=new Audio(VOICE+MARA[k]); a.volume=0.9;
 const sb=document.getElementById('sub'); sb.textContent='Mara: '+SUB[k]; sb.style.display='block';
 a.onended=a.onerror=()=>{maraBusy=false; setTimeout(()=>sb.style.display='none',600);}; a.play().catch(()=>{maraBusy=false; setTimeout(()=>sb.style.display='none',3500);}); }
// ---------- grain (desktop overlay) ----------
(()=>{const c=document.getElementById('ffgrain'),x=c.getContext('2d');c.width=320;c.height=180;const d=x.createImageData(320,180);(function f(){for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}x.putImageData(d,0,0);setTimeout(()=>requestAnimationFrame(f),60);})();})();
S.addEventListener('loaded',()=>{
 const G=S.object3D, TL=new T.TextureLoader();
 const tex=(u,cb)=>TL.load(u,t=>{t.colorSpace=T.SRGBColorSpace;t.anisotropy=8;cb&&cb(t);});
 const std=o=>new T.MeshStandardMaterial(o);
 // ---------- photo world: curved backdrop (front), 1px = 0.0063 m, photo TV behind 3D TV ----------
 const bm=new T.MeshBasicMaterial({color:0xffffff,fog:false,toneMapped:false,side:T.DoubleSide});
 tex('../assets/era1984/placeholder.jpg',t=>{ if(!bm.map){bm.map=t;bm.needsUpdate=true;} });
 tex(BACKDROP,t=>{bm.map=t;bm.needsUpdate=true;});
 const PX=0.0085, R=3.6, H=512*PX, ang=768*PX/R;
 const bd=new T.Mesh(new T.CylinderGeometry(R,R,H,48,1,true,Math.PI-ang/2,ang),bm); bd.scale.x=-1;
 bd.position.set(0.34+54*PX-0.12,1.0+(268-256)*PX,1.4); G.add(bd);
 // dark room shell (sides/back/ceiling/floor) — closes the world, hides edges
 const wallM=std({color:0x3a1a30,roughness:0.95,emissive:0x12060e}); const floorM=std({color:0x3a1c34,roughness:1});
 tex('../assets/tex/kirmes/Fabric/Fabric045_1K-JPG_Color.jpg',t=>{t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(6,6);floorM.map=t;floorM.needsUpdate=true;});
 const box=(w,h,d,m,x,y,z)=>{const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);G.add(o);return o;};
 box(0.1,3.4,2.6,wallM,-2.75,1.7,0.75); box(0.1,3.4,2.6,wallM,2.75,1.7,0.75); box(5.6,3.4,0.1,wallM,0,1.7,2.05); box(5.6,0.1,4.6,wallM,0,3.35,-0.2);
 const fl=new T.Mesh(new T.PlaneGeometry(5.6,4.6),floorM); fl.rotation.x=-Math.PI/2; fl.position.set(0,0,-0.1); G.add(fl);
 // 3D furniture in front of the photo (TV dresser + side shelf)
 const wood=std({color:0x4a2a1c,roughness:0.75}); tex('../assets/tex/kirmes/WoodFloor/WoodFloor051_1K-JPG_Color.jpg',t=>{wood.map=t;wood.needsUpdate=true;});
 box(1.3,0.72,0.65,wood,0.28,0.36,-1.9); const shelf=box(0.9,0.75,0.4,wood,-1.6,0.375,-0.9); box(0.6,0.9,0.4,wood,1.7,0.45,-1.1);
 // glow around lights (photo neon sign + lamp) — additive soft sprites
 const gc=document.createElement('canvas');gc.width=gc.height=128;const gx=gc.getContext('2d');const gr=gx.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,255,255,0.9)');gr.addColorStop(0.3,'rgba(255,255,255,0.25)');gr.addColorStop(1,'rgba(255,255,255,0)');gx.fillStyle=gr;gx.fillRect(0,0,128,128);
 const gt=new T.CanvasTexture(gc);
 const glow=(x,y,z,s,col,op)=>{const sp=new T.Sprite(new T.SpriteMaterial({map:gt,color:col,transparent:true,opacity:op,depthWrite:false,blending:T.AdditiveBlending,fog:false}));sp.position.set(x,y,z);sp.scale.set(s,s*0.6,1);G.add(sp);return sp;};
 const g1=glow(0.61,2.55,-2.0,2.2,0xff4fd0,0.35), g2=glow(-1.9,1.3,-1.25,0.8,0xffa040,0.45), g3=glow(0.95,1.58,-2.0,1.3,0x60e0ff,0.18);
 // parody posters (subtle, side walls)
 [['p1',-2.69,1.65,0.2,1],['p2',-2.69,1.6,1.4,1],['p3',2.69,1.7,0.4,-1],['p4',2.69,1.6,1.5,-1]].forEach(([n,x,y,z,s])=>{const m=std({color:0x9a8090,roughness:0.85});tex('../assets/era1984/'+n+'.jpg',t=>{m.map=t;m.needsUpdate=true;});const p=new T.Mesh(new T.PlaneGeometry(0.5,0.75),m);p.position.set(x,y,z);p.rotation.y=s*Math.PI/2;G.add(p);});
 // ---------- grabbables: VHS (c1-c3), book (c4), cereal (c5) ----------
 const items=[];
 function item(n,w,h,d,x,y,z,ry,spine){ const fm=std({color:0xffffff,roughness:0.6}); tex('../assets/era1984/'+n+'.jpg',t=>{fm.map=t;fm.needsUpdate=true;});
  const sm=std({color:spine,roughness:0.7}); const mats=[sm,sm,sm,sm,fm,sm];
  const el=document.createElement('a-entity'); el.classList.add('clickable'); S.appendChild(el);
  el.addEventListener('loaded',()=>{ const me=new T.Mesh(new T.BoxGeometry(w,h,d),mats); el.setObject3D('mesh',me); el.object3D.position.set(x,y+h/2,z); el.object3D.rotation.y=ry; });
  const it={el,n,h,home:new T.Vector3(x,y+h/2,z),vy:0,held:null}; items.push(it);
  el.addEventListener('click',e=>{ e.stopPropagation&&e.stopPropagation(); grab(it,e.detail&&e.detail.cursorEl); }); return it; }
 item('c1',0.105,0.19,0.025,-1.85,0.75,-0.9,0.25,0x111111); item('c2',0.105,0.19,0.025,-1.7,0.75,-0.95,0.1,0x111111); item('c3',0.105,0.19,0.025,-1.55,0.75,-0.88,-0.15,0x151515);
 item('c4',0.15,0.22,0.035,-1.3,0.75,-0.9,-0.3,0x5a2a1a); item('c5',0.19,0.28,0.07,1.7,0.9,-1.15,-0.4,0xd8c070);
 let held=null, grabs=0;
 function grab(it,src){ if(held&&held!==it) drop(); if(held===it){ drop(); return; }
  const hand=(src&&src.id&&src.id!=='')?src:null; const par=(hand&&(hand.id==='hl'||hand.id==='hr'))?hand.object3D:document.getElementById('cam').object3D;
  par.attach(it.el.object3D); if(par===document.getElementById('cam').object3D){ it.el.object3D.position.set(0.12,-0.18,-0.45); } else { it.el.object3D.position.set(0,0,-0.12); }
  it.el.object3D.rotation.set(-0.3,0,0); held=it; it.vy=0; grabs++; mara(grabs===1?'grab':(grabs===4?'odd':(grabs===7?'nope':'grab')), true); }
 function drop(){ if(!held) return; G.attach(held.el.object3D); held.el.object3D.rotation.set(0,held.el.object3D.rotation.y,0); held.falling=true; held=null; }
 window.addEventListener('mousedown',e=>{ setTimeout(()=>{ if(held && !e.__used) {} },0); });
 S.addEventListener('click',e=>{ if(held && e.target===S) drop(); });
 ['hl','hr'].forEach(id=>document.getElementById(id).addEventListener('triggerdown',()=>{ const rc=document.getElementById(id).components.raycaster; if(held && (!rc||!rc.intersectedEls.length)) drop(); }));
 // surfaces for falling items
 const surf=[[-1.6,-0.9,0.9,0.4,0.75],[0.28,-1.9,1.3,0.65,0.72],[1.7,-1.1,0.6,0.4,0.9]];
 AFRAME.registerComponent('era-tick',{tick(t,dt){ const d=Math.min(dt,50)/1000; items.forEach(it=>{ if(!it.falling) return; const o=it.el.object3D; it.vy-=9.8*d; o.position.y+=it.vy*d;
   let fy=0; surf.forEach(([x,z,w,dd,h])=>{ if(Math.abs(o.position.x-x)<w/2&&Math.abs(o.position.z-z)<dd/2) fy=Math.max(fy,h); });
   if(o.position.y<fy+it.h/2){ o.position.y=fy+it.h/2; it.vy=0; it.falling=false; } });
   const k=0.5+0.5*Math.sin(t*0.0013); g1.material.opacity=0.3+0.08*k; }}); S.setAttribute('era-tick','');
 // Mara: enter + TV
 setTimeout(()=>mara('enter'),2500);
 document.getElementById('tv').addEventListener('click',()=>{ setTimeout(()=>mara('tv'),6000); });
 // VR grain (head-locked, subtle)
 const nc=document.createElement('canvas');nc.width=nc.height=128;const nx=nc.getContext('2d');const nd=nx.createImageData(128,128);const nt=new T.CanvasTexture(nc);
 const nm=new T.Mesh(new T.PlaneGeometry(0.5,0.5),new T.MeshBasicMaterial({map:nt,transparent:true,opacity:0.06,depthTest:false,depthWrite:false,blending:T.AdditiveBlending,fog:false}));nm.position.set(0,0,-0.12);nm.renderOrder=999;document.getElementById('cam').object3D.add(nm);
 setInterval(()=>{for(let i=0;i<nd.data.length;i+=4){const v=Math.random()*255;nd.data[i]=nd.data[i+1]=nd.data[i+2]=v;nd.data[i+3]=255;}nx.putImageData(nd,0,0);nt.needsUpdate=true;},70);
});
// VR locomotion: left stick move, right stick snap 30°, clamp to room
AFRAME.registerComponent('room-move',{init(){ this.ax=[0,0]; this.snap=0;
 const L=()=>document.getElementById('hl'), Rr=()=>document.getElementById('hr');
 setTimeout(()=>{ L().addEventListener('thumbstickmoved',e=>{this.ax=[e.detail.x,e.detail.y];}); Rr().addEventListener('thumbstickmoved',e=>{ const x=e.detail.x; if(Math.abs(x)>0.7&&!this.snap){ this.snap=1; this.el.object3D.rotation.y-=Math.sign(x)*Math.PI/6; } if(Math.abs(x)<0.3) this.snap=0; }); },0); },
 tick(t,dt){ const o=this.el.object3D, d=Math.min(dt,50)/1000; const [x,y]=this.ax; if(Math.abs(x)>0.15||Math.abs(y)>0.15){ const cam=document.getElementById('cam').object3D; const q=new THREE.Quaternion(); cam.getWorldQuaternion(q); const f=new THREE.Vector3(x,0,y).applyQuaternion(q); f.y=0; o.position.addScaledVector(f,1.4*d); }
  const c=document.getElementById('cam').object3D.position; const wx=o.position.x+c.x, wz=o.position.z+c.z; o.position.x+=Math.max(-1.8,Math.min(1.8,wx))-wx; o.position.z+=Math.max(-1.4,Math.min(1.7,wz))-wz; }});
</script></body></html>
