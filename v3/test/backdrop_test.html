<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Rewind · Fensterblick-Test (Blender-Panoramen)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script><script src="lib/depthbg.js?v=2"></script>
<style>#hud{position:fixed;left:12px;top:10px;z-index:5;color:#e8f0e8;font:600 14px/1.4 sans-serif;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:10px;max-width:520px}
#hud button{font:600 13px sans-serif;margin:4px 4px 0 0;padding:4px 9px;border-radius:6px;border:1px solid #556;background:#1a1d26;color:#dde}#hud button.on{background:#4a3a1a;border-color:#c90}</style></head><body>
<div id="hud"><b>Fensterblick-Test</b> · Blender-Cycles-Panorama (fern) + Mittel-Ebene (Parallaxe)<br>
Desktop: Maus ziehen = umsehen, WASD gehen, Tasten 1–5 Szene, P = Parallaxe an/aus<br>VR: L-Stick gehen · R-Stick drehen · Laser+Trigger auf die Tafeln rechts<br>
<button data-s="berlin89">1 · Ost-Berlin 1989</button><button data-s="city2041">2 · Stadt 2041</button><button data-s="maisfeld">3 · Maisfeld-Ende</button><button data-s="bild2041">4 · Bild+Tiefe 2041</button><button data-s="bild1989">5 · Bild+Tiefe 1989</button><button id="px">P · Parallaxe</button></div>
<a-scene renderer="colorManagement:true; antialias:true; foveationLevel:0.2" webxr="referenceSpaceType:local-floor" light="defaultLightsEnabled:false" background="color:#000" cursor="rayOrigin:mouse" raycaster="objects:.clickable" fog="type:exponential; color:#050506; density:0.02">
 <a-assets timeout="20000">
  <img id="t_wall" src="../assets/tex/apt/wall_c.jpg"><img id="t_wall_n" src="../assets/tex/apt/wall_n.jpg">
  <img id="t_floor" src="../assets/tex/apt/floor_c.jpg"><img id="t_floor_n" src="../assets/tex/apt/floor_n.jpg">
  <img id="t_ceil" src="../assets/tex/apt/ceil_c.jpg"><img id="t_cur" src="../assets/tex/apt/curtain_c.jpg">
 </a-assets>
 <!-- Panorama-Kugeln: fern (r=400) + Mittel-Ebene (r je Szene). Blender +Y (Bildmitte) -> A-Frame -Z -->
 <a-entity id="far" position="0 1.6 0" rotation="0 -90 0" scale="-1 1 1" geometry="primitive:sphere; radius:400; segmentsWidth:64; segmentsHeight:32" material="shader:flat; side:double; fog:false; npot:true"></a-entity>
 <a-entity id="mid" position="0 1.6 0" rotation="0 -90 0" scale="-1 1 1" geometry="primitive:sphere; radius:16; segmentsWidth:64; segmentsHeight:32" material="shader:flat; side:double; fog:false; transparent:true; depthWrite:false; npot:true"></a-entity>
 <!-- Raum 4 x 4 x 2,6 m, Fenster in der Nordwand (z=-2): Öffnung x -0,8..0,8, y 0,9..2,2 -->
 <a-entity id="room">
  <a-plane rotation="-90 0 0" width="4" height="4" material="src:#t_floor; normalMap:#t_floor_n; repeat:2 2; roughness:0.8; color:#8a8278"></a-plane>
  <a-plane position="0 2.6 0" rotation="90 0 0" width="4" height="4" material="src:#t_ceil; repeat:2 2; color:#6a6660; roughness:1"></a-plane>
  <a-box class="w" position="-1.4 1.3 -2.05" width="1.2" height="2.6" depth="0.1"></a-box>
  <a-box class="w" position="1.4 1.3 -2.05" width="1.2" height="2.6" depth="0.1"></a-box>
  <a-box class="w" position="0 0.45 -2.05" width="1.6" height="0.9" depth="0.1"></a-box>
  <a-box class="w" position="0 2.4 -2.05" width="1.6" height="0.4" depth="0.1"></a-box>
  <a-box class="w" position="0 1.3 2.05" width="4.2" height="2.6" depth="0.1"></a-box>
  <a-box class="w" position="-2.05 1.3 0" width="0.1" height="2.6" depth="4.2"></a-box>
  <a-box class="w" position="2.05 1.3 0" width="0.1" height="2.6" depth="4.2"></a-box>
  <!-- Laibung + Fensterrahmen (Holz, dunkel) + Sprossen -->
  <a-box position="0 0.88 -2.0" width="1.75" height="0.05" depth="0.28" material="color:#2a241e; roughness:0.6"></a-box>
  <a-entity id="frame"></a-entity>
  <a-plane position="0 1.55 -2.06" width="1.6" height="1.3" material="color:#88a; opacity:0.05; transparent:true; metalness:0.9; roughness:0.05; depthWrite:false"></a-plane>
  <a-plane position="-0.95 1.45 -1.92" width="0.5" height="1.9" material="src:#t_cur; color:#5a4a40; side:double; roughness:1"></a-plane>
  <a-plane position="0.98 1.45 -1.92" width="0.45" height="1.9" material="src:#t_cur; color:#5a4a40; side:double; roughness:1"></a-plane>
  <!-- Heizkörper unter dem Fenster, Tisch -->
  <a-box position="0 0.5 -1.94" width="1.2" height="0.55" depth="0.08" material="color:#5c5a54; roughness:0.5; metalness:0.3"></a-box>
  <a-box position="-1.3 0.74 -1.3" width="1.0" height="0.04" depth="0.6" material="color:#3a2c22; roughness:0.7"></a-box>
  <a-box position="-1.3 0.37 -1.3" width="0.95" height="0.74" depth="0.55" material="color:#2c221a; roughness:0.8"></a-box>
  <!-- einzige Innenlampe: Tischlampe, warm, schwach -->
  <a-cylinder position="-1.55 0.95 -1.35" radius="0.11" height="0.17" open-ended="true" material="color:#d8a060; emissive:#ffb060; emissiveIntensity:0.6; side:double"></a-cylinder>
  <a-entity light="type:point; color:#ffb070; intensity:0.9; distance:5; decay:2" position="-1.55 1.0 -1.35"></a-entity>
  <a-entity light="type:ambient; color:#20242c; intensity:0.35"></a-entity>
 </a-entity>
 <!-- Szenen-Tafeln (VR) an der Ostwand -->
 <a-entity id="panels" position="1.98 1.45 -0.6" rotation="0 -90 0">
  <a-plane class="clickable sel" data-s="berlin89" position="-0.55 0 0" width="0.5" height="0.22" color="#1a1d26" text="value:1989 Ost-Berlin; align:center; width:1.4; color:#e8e0d0"></a-plane>
  <a-plane class="clickable sel" data-s="city2041" position="0 0 0" width="0.5" height="0.22" color="#1a1d26" text="value:2041 Stadt; align:center; width:1.4; color:#e8e0d0"></a-plane>
  <a-plane class="clickable sel" data-s="maisfeld" position="0.55 0 0" width="0.5" height="0.22" color="#1a1d26" text="value:Maisfeld; align:center; width:1.4; color:#e8e0d0"></a-plane>
  <a-plane class="clickable sel" data-s="bild2041" position="-0.3 -0.28 0" width="0.5" height="0.2" color="#1a1d26" text="value:Bild+Tiefe 2041; align:center; width:1.3; color:#e8e0d0"></a-plane>
  <a-plane class="clickable sel" data-s="bild1989" position="0.3 -0.28 0" width="0.5" height="0.2" color="#1a1d26" text="value:Bild+Tiefe 1989; align:center; width:1.3; color:#e8e0d0"></a-plane>
  <a-plane class="clickable" id="pxv" position="0 -0.55 0" width="0.7" height="0.18" color="#1a1d26" text="value:Parallaxe an/aus; align:center; width:1.4; color:#e8e0d0"></a-plane>
 </a-entity>
 <a-entity id="rig" stick-move>
  <a-camera id="cam" position="0 1.6 0.6" wasd-controls="acceleration:14"></a-camera>
  <a-entity id="hl" laser-controls="hand:left" raycaster="objects:.clickable; far:6"></a-entity>
  <a-entity id="hr" laser-controls="hand:right" raycaster="objects:.clickable; far:6"></a-entity>
 </a-entity>
</a-scene>
<script>
const Q=new URLSearchParams(location.search), HQ=Q.get("lq")!=="1";
// Mittel-Ebenen-Radius = typische Entfernung der Objekte in dieser Ebene (Blender)
const SC={berlin89:{mid:16,name:'1989 Ost-Berlin'},city2041:{mid:65,name:'2041 Stadt'},maisfeld:{mid:9,name:'Maisfeld-Ende'},bild2041:{depth:1},bild1989:{depth:1}};
// Variante B: Einzelbild (Perchance) + Tiefenkarte (Depth Anything V2) als verschobenes Gitter-Mesh, Strahlen ab Augpunkt
const DM={}; function depthMesh(s){ if(DM[s]) return Promise.resolve(DM[s]);
 return DepthBG.create(document.querySelector('a-scene').object3D,{img:`${base}${s}.jpg`,depth:`${base}${s}_depth.png`,position:[0,1.6,0],hfov:84,aspect:1.5,near:6,far:160,fade:0.14}).then(m=>{ DM[s]=m; m.visible=false; return m; }); }
const base='../sky/backdrop/', sz=HQ?"4k":"2k"; let cur=null, par=true;
AFRAME.registerComponent('stick-move',{init(){this.mv={x:0,y:0};this.snap=0;
  const L=document.getElementById('hl'),R=document.getElementById('hr');
  L.addEventListener('thumbstickmoved',e=>{this.mv.x=e.detail.x;this.mv.y=e.detail.y;});
  R.addEventListener('thumbstickmoved',e=>{const x=e.detail.x; if(Math.abs(x)>0.7&&!this.snap){this.snap=1;this.el.object3D.rotation.y-=Math.sign(x)*Math.PI/6;} if(Math.abs(x)<0.3)this.snap=0;});},
 tick(t,dt){const m=this.mv; if(Math.abs(m.x)<0.15&&Math.abs(m.y)<0.15)return; const cam=document.getElementById('cam').object3D;
  const yaw=new THREE.Euler().setFromQuaternion(cam.getWorldQuaternion(new THREE.Quaternion()),'YXZ').y; const s=1.4*dt/1000;
  const dx=(m.x*Math.cos(yaw)+m.y*Math.sin(yaw))*s, dz=(-m.x*Math.sin(yaw)+m.y*Math.cos(yaw))*s; const p=this.el.object3D.position;
  p.x=Math.max(-1.6,Math.min(1.6,p.x+dx)); p.z=Math.max(-2.2,Math.min(1.0,p.z+dz));}});
function setScene(s){ if(!SC[s])return; cur=s; const far=document.getElementById('far'), mid=document.getElementById('mid');
 Object.values(DM).forEach(m=>m.visible=false); const isD=!!SC[s].depth; far.setAttribute('visible',!isD); if(isD){ mid.setAttribute('visible',false); depthMesh(s).then(m=>{ if(cur===s) m.visible=true; }); markUI(s); return; } far.setAttribute('visible',true);
 far.setAttribute('material','src',`${base}${s}_far_${sz}.jpg`);
 mid.setAttribute('geometry','radius',SC[s].mid); mid.setAttribute("material","src",`${base}${s}_mid_${sz}.${HQ?"webp":"png"}`); mid.setAttribute('visible',par);
 markUI(s); }
function markUI(s){ document.querySelectorAll('#hud button[data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
 document.querySelectorAll('.sel').forEach(p=>p.setAttribute('color',p.dataset.s===s?'#4a3a1a':'#1a1d26')); history.replaceState(null,'','?s='+s+(HQ?"":"&lq=1")); }
function togglePar(){par=!par; if(!(SC[cur]&&SC[cur].depth)) document.getElementById('mid').setAttribute('visible',par); document.getElementById('px').classList.toggle('on',par);}
document.querySelectorAll('#hud button[data-s]').forEach(b=>b.onclick=()=>setScene(b.dataset.s)); document.getElementById('px').onclick=togglePar;
addEventListener('keydown',e=>{const k={'1':'berlin89','2':'city2041','3':'maisfeld','4':'bild2041','5':'bild1989'}[e.key]; if(k)setScene(k); if(e.key==='p'||e.key==='P')togglePar();});
const sceneEl=document.querySelector('a-scene');
sceneEl.addEventListener('loaded',()=>{
 document.querySelectorAll('.w').forEach(w=>w.setAttribute('material','src:#t_wall; normalMap:#t_wall_n; repeat:1 1; color:#7a7468; roughness:0.9'));
 // Fensterrahmen: Blendrahmen + Kreuzsprosse (Kunststoff/Holz, dunkel)
 const fr=document.getElementById('frame'), mat='color:#1e1a16; roughness:0.55';
 [[0,2.2,1.66,0.07],[0,0.9,1.66,0.07],[-0.8,1.55,0.07,1.37],[0.8,1.55,0.07,1.37],[0,1.55,0.05,1.3],[0,1.75,1.6,0.045]].forEach(([x,y,w,h])=>{const b=document.createElement('a-box');b.setAttribute('position',`${x} ${y} -2.04`);b.setAttribute('width',w);b.setAttribute('height',h);b.setAttribute('depth',0.09);b.setAttribute('material',mat);fr.appendChild(b);});
 document.querySelectorAll('.sel').forEach(p=>p.addEventListener('click',()=>setScene(p.dataset.s))); document.getElementById('pxv').addEventListener('click',togglePar);
 setScene(Q.get('s')||'berlin89'); document.getElementById('px').classList.add('on'); });
</script></body></html>
