<script>(()=>{const c=document.getElementById('ffgrain'),x=c.getContext('2d');c.width=320;c.height=180;const d=x.createImageData(320,180);(function f(){for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}x.putImageData(d,0,0);setTimeout(()=>requestAnimationFrame(f),60);})();})();</script>

<script>
const sc=document.querySelector('a-scene');
sc.addEventListener('loaded',()=>{
const T=THREE,S=sc.object3D,R=sc.renderer; R.xr.setFramebufferScaleFactor&&R.xr.setFramebufferScaleFactor(1.4);
let AC=null; const ac=()=>{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)(); if(AC.state!=='running')AC.resume(); return AC;};
function noise(dur,f,q,g,type='bandpass'){const a=ac(),n=a.createBuffer(1,a.sampleRate*dur,a.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.2);
 const s=a.createBufferSource();s.buffer=n;const bf=a.createBiquadFilter();bf.type=type;bf.frequency.value=f;bf.Q.value=q;const gn=a.createGain();gn.gain.value=g;s.connect(bf);bf.connect(gn);gn.connect(a.destination);s.start();}
function tone(f,dur,g,type='sine',f2){const a=ac(),o=a.createOscillator(),gn=a.createGain(),t=a.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(gn);gn.connect(a.destination);o.start(t);o.stop(t+dur);}
const SND={bounce:v=>{noise(0.1,220+Math.random()*80,0.9,0.35*v,'lowpass');tone(90,0.08,0.08*v,'sine',40);},
 swish:()=>{noise(0.35,2400,0.6,0.22,'bandpass');tone(880,0.25,0.05,'sine',1400);},
 rim:()=>{noise(0.08,900,3,0.4);tone(420,0.12,0.1,'triangle',180);},
 thud:v=>noise(0.12,180,1.2,0.3*v,'lowpass'),
 clock:()=>{const a=ac(),t0=a.currentTime;for(let i=0;i<7;i++){const t=t0+i*0.45;const o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();o.type='square';o.frequency.value=i%2?920:780;f.type='bandpass';f.frequency.value=1100;f.Q.value=4;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.035,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+0.07);o.connect(f);f.connect(g);g.connect(a.destination);o.start(t);o.stop(t+0.09);}},
 bell:()=>{[880,1100,1320].forEach((f,i)=>setTimeout(()=>tone(f,0.5,0.12),i*120));}};
window.__loopClock={sec:20*60,bonusUsed:false,add(s){ if(this.bonusUsed) return false; this.bonusUsed=true; this.sec+=s; return true; }};
const cv=(w,h,fn)=>{const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;t.anisotropy=8;return t;};
const std=o=>new T.MeshStandardMaterial(Object.assign({roughness:0.7},o));
const loader=new T.TextureLoader();
function loadTex(url,rep=1){return new Promise(res=>{loader.load(url,t=>{t.colorSpace=T.SRGBColorSpace;t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rep,rep);t.anisotropy=8;res(t);},undefined,()=>res(null));});}
const asphalt=cv(512,512,(x,w,h)=>{x.fillStyle='#2a2b30';x.fillRect(0,0,w,h);for(let i=0;i<12000;i++){const v=30+Math.random()*50;x.fillStyle=`rgb(${v},${v},${v+3})`;x.fillRect(Math.random()*w,Math.random()*h,2,2);}});
asphalt.wrapS=asphalt.wrapT=T.RepeatWrapping;asphalt.repeat.set(6,6);
const brick=cv(512,512,(x,w,h)=>{x.fillStyle='#3a2a24';x.fillRect(0,0,w,h);const bw=64,bh=28;for(let y=0,row=0;y<h;y+=bh+4,row++){for(let col=0;col<10;col++){const ox=(row%2)*(bw/2);const xx=col*bw+ox;
 const r=90+Math.random()*40,g=45+Math.random()*25,b=35+Math.random()*20;x.fillStyle=`rgb(${r},${g},${b})`;x.fillRect(xx%w,y,bw-3,bh);}}});
brick.wrapS=brick.wrapT=T.RepeatWrapping;brick.repeat.set(3,2.2);
const metal=std({color:0x6a7078,metalness:0.85,roughness:0.35});
const wood=std({color:0x5a3a22,roughness:0.8});

// === X-Files / FMV hybrid (Pete): real photos = world; 3D only for grabbables (hoop, ball) ===
const photoMat=(url,opts={})=>{const m=new T.MeshStandardMaterial({color:0xffffff,roughness:0.92,metalness:0,fog:true,...opts});loader.load(url,t=>{t.colorSpace=T.SRGBColorSpace;t.anisotropy=8;t.wrapS=t.wrapT=T.ClampToEdgeWrapping;m.map=t;m.needsUpdate=true;});return m;};
// far sphere (Poly Haven courtyard night CC0)
(()=>{const pt=new T.TextureLoader().load('../assets/pano/basket_courtyard_night_4k_dark.jpg',t=>{t.colorSpace=T.SRGBColorSpace;t.anisotropy=8;});
const sph=new T.Mesh(new T.SphereGeometry(40,96,48),new T.MeshBasicMaterial({map:pt,side:T.BackSide,fog:false,toneMapped:false,depthWrite:false}));
sph.position.y=1.4; sph.rotation.y=Math.PI*1.15; sph.renderOrder=-20; S.add(sph);})();
// photo floor (no tiling — one photograph)
const ground=new T.Mesh(new T.CircleGeometry(12,72),photoMat('../assets/pano/basket_floor_photo.jpg'));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; ground.renderOrder=-5; S.add(ground);
// photo wall (wallpaper) — graffiti baked into photo
const wall=new T.Mesh(new T.PlaneGeometry(16,7.2),photoMat('../assets/pano/basket_wall_photo.jpg'));
wall.position.set(0,3.2,-5.2); S.add(wall);
// thin dark edge under wall so hoop mount reads solid
const wallBase=new T.Mesh(new T.BoxGeometry(11,0.15,0.35),new T.MeshBasicMaterial({color:0x1a1210,fog:false})); wallBase.position.set(0,0.08,-5.25); wallBase.scale.set(1.45,1,1); S.add(wallBase);

(async()=>{
  const brickT=await loadTex('../assets/tex/kirmes/Brick/Bricks076A_1K-JPG_Color.jpg',2.5);
  const aspT=await loadTex('../assets/tex/kirmes/Asphalt/Asphalt025B_1K-JPG_Color.jpg',5);
  const woodT=await loadTex('../assets/tex/kirmes/WoodFloor/WoodFloor051_1K-JPG_Color.jpg',2);
  /* wall is photo wallpaper */
  /* floor is photo wallpaper */
  if(woodT) window.__woodT=woodT;
})();
// crates / pallets / fence (procedural PBR-ish)
function crate(x,z,s=1,yaw=0){ const g=new T.Group(); g.position.set(x,0,z); g.rotation.y=yaw; S.add(g);
  const m=std({color:0x8a6238,roughness:0.85,map:null}); const b=new T.Mesh(new T.BoxGeometry(0.55*s,0.5*s,0.55*s),m); b.position.y=0.25*s; g.add(b);
  for(const [ox,oy,oz,sx,sy,sz] of [[0,0.26*s,0,0.58*s,0.04*s,0.58*s],[0,0.02,0,0.58*s,0.04*s,0.58*s]]){ const sl=new T.Mesh(new T.BoxGeometry(sx,sy,sz),std({color:0x6a4a28,roughness:0.9})); sl.position.set(ox,oy,oz); g.add(sl);} return g; }
function pallet(x,z,yaw=0){ const g=new T.Group(); g.position.set(x,0,z); g.rotation.y=yaw; S.add(g);
  for(let i=0;i<5;i++){ const sl=new T.Mesh(new T.BoxGeometry(1.0,0.04,0.12),std({color:0x7a5a32,roughness:0.9})); sl.position.set(0,0.06, -0.4+i*0.2); g.add(sl); }
  for(let i=0;i<3;i++){ const sl=new T.Mesh(new T.BoxGeometry(0.12,0.08,1.0),std({color:0x5a4020,roughness:0.9})); sl.position.set(-0.35+i*0.35,0.02,0); g.add(sl);} return g; }
function bin(x,z,col){ const g=new T.Group(); g.position.set(x,0,z); S.add(g);
  const body=new T.Mesh(new T.CylinderGeometry(0.28,0.32,0.9,18),std({color:col,roughness:0.45,metalness:0.55})); body.position.y=0.48; g.add(body);
  const rim=new T.Mesh(new T.TorusGeometry(0.3,0.025,8,24),std({color:0x222226,metalness:0.7,roughness:0.4})); rim.rotation.x=Math.PI/2; rim.position.y=0.92; g.add(rim);
  const lid=new T.Mesh(new T.CylinderGeometry(0.31,0.31,0.05,18),std({color:0x1a1a1e,roughness:0.5,metalness:0.4})); lid.position.set(0.05,0.98,0); lid.rotation.z=0.25; g.add(lid);
  const handle=new T.Mesh(new T.TorusGeometry(0.08,0.015,6,16),metal); handle.position.set(0,0.7,0.32); g.add(handle); return g; }
function fence(x0,z0,x1,z1){ const dx=x1-x0,dz=z1-z0,len=Math.hypot(dx,dz),yaw=Math.atan2(dx,dz);
  const g=new T.Group(); g.position.set((x0+x1)/2,0,(z0+z1)/2); g.rotation.y=yaw; S.add(g);
  for(let i=0;i<=8;i++){ const p=new T.Mesh(new T.BoxGeometry(0.06,1.3,0.06),std({color:0x3a3028,roughness:0.9})); p.position.set(0,0.65,-len/2+i*(len/8)); g.add(p); }
  for(const y of [0.35,0.85]){ const r=new T.Mesh(new T.BoxGeometry(0.04,0.05,len),std({color:0x4a4034,roughness:0.85})); r.position.y=y; g.add(r);} }


 /* fences hidden — photo world */
// distant city glow
const city=cv(1024,256,(x,w,h)=>{ const g=x.createLinearGradient(0,0,0,h); g.addColorStop(0,'#0a1020'); g.addColorStop(0.55,'#1a2848'); g.addColorStop(1,'#3a2040');
 x.fillStyle=g; x.fillRect(0,0,w,h); for(let i=0;i<80;i++){ const bx=Math.random()*w, bw=8+Math.random()*30, bh=20+Math.random()*90; x.fillStyle='#0c1428'; x.fillRect(bx,h-bh,bw,bh);
  for(let k=0;k<8;k++){ x.fillStyle=`rgba(255,${180+Math.random()*60},${80},${0.3+Math.random()*0.5})`; x.fillRect(bx+2+Math.random()*(bw-4), h-bh+4+Math.random()*(bh-10), 2, 2);} }
 x.fillStyle='rgba(255,160,80,0.25)'; x.fillRect(0,h*0.7,w,h*0.3); });
const cityM=new T.Mesh(new T.PlaneGeometry(40,8),new T.MeshBasicMaterial({map:city,toneMapped:false,transparent:true,opacity:0.85})); cityM.position.set(0,3.2,-18); /* old procedural skyline removed — photo sphere */
const wallWarm=new T.PointLight(0xffa860,1.1,5,2); wallWarm.position.set(-2.4,3.2,-3.6); S.add(wallWarm); const wallFill=new T.PointLight(0xffb070,0.0,10,2); wallFill.position.set(0.3,2.6,-2.0); S.add(wallFill); const hoopFill=new T.PointLight(0xffd0a0,0.9,7,2); hoopFill.position.set(0,3.0,-2.5); S.add(hoopFill);
const cityGlow=new T.PointLight(0xff8a40,0.0,40,2); cityGlow.position.set(0,2.5,-12); S.add(cityGlow);
// streetlight with cone + moths/dust
const pole=new T.Mesh(new T.CylinderGeometry(0.07,0.09,4.4,10),metal);pole.position.set(4.2,2.2,-4.6);S.add(pole);
const arm=new T.Mesh(new T.BoxGeometry(1.35,0.07,0.07),metal);arm.position.set(2.75,4.35,-3.6);S.add(arm);
const lamp=new T.Mesh(new T.SphereGeometry(0.07,12,10),std({color:0xffe0a8,emissive:0xffb060,emissiveIntensity:1.2,roughness:0.4,metalness:0.2}));lamp.position.set(3.0,4.5,-4.5);S.add(lamp);
const lampL=new T.PointLight(0xffc080,2.2,10,1.8); lampL.position.copy(lamp.position); S.add(lampL);
const lampGround=new T.PointLight(0xffb070,1.4,8,1.8); lampGround.position.set(2.0,1.2,-4.0); S.add(lampGround);
// soft lamp glow only (no cone/slab meshes)
// moths / dust in light
const dustN=90, dustPos=new Float32Array(dustN*3); for(let i=0;i<dustN;i++){ dustPos[i*3]=(Math.random()-0.5)*4; dustPos[i*3+1]=0.3+Math.random()*3.5; dustPos[i*3+2]=(Math.random()-0.5)*4; }
const dustG=new T.BufferGeometry(); dustG.setAttribute('position',new T.BufferAttribute(dustPos,3));
const dustGlow=cv(32,32,(x,w,h)=>{const g=x.createRadialGradient(16,16,0,16,16,16);g.addColorStop(0,'rgba(255,240,200,1)');g.addColorStop(1,'rgba(255,200,100,0)');x.fillStyle=g;x.fillRect(0,0,w,h);});
const dust=new T.Points(dustG,new T.PointsMaterial({map:dustGlow,size:0.028,transparent:true,opacity:0.55,depthWrite:false,blending:T.AdditiveBlending,color:0xffe0a8})); dust.position.set(1.9,0,-3.0); dust.scale.set(0.6,1,0.6); S.add(dust);
// backboard + rim
const boardG=new T.Group();boardG.position.set(0,3.15,-5.0);S.add(boardG);
const board=new T.Mesh(new T.BoxGeometry(1.85,1.1,0.07),std({color:0xe8e4dc,roughness:0.55,metalness:0.05}));boardG.add(board);
const frame=new T.Mesh(new T.BoxGeometry(1.9,1.15,0.04),std({color:0x2a2a2e,metalness:0.6,roughness:0.4})); frame.position.z=-0.04; boardG.add(frame);
const sq=new T.Mesh(new T.PlaneGeometry(0.55,0.42),new T.MeshBasicMaterial({color:0xd82028}));sq.position.set(0,-0.1,0.038);boardG.add(sq);
const rimY=2.6, rimZ=-4.67, rimR=0.225;
const rim=new T.Mesh(new T.TorusGeometry(rimR,0.022,10,36),std({color:0xd84020,metalness:0.7,roughness:0.35}));
rim.rotation.x=Math.PI/2;rim.position.set(0,rimY,rimZ);S.add(rim);
const netMat=new T.LineBasicMaterial({color:0xeeeeee,transparent:true,opacity:0.7});
for(let i=0;i<12;i++){const a=i/12*Math.PI*2, pts=[]; for(let k=0;k<6;k++){const t=k/5, rr=rimR*(1-t*0.55); pts.push(new T.Vector3(Math.cos(a)*rr, rimY-t*0.42, rimZ+Math.sin(a)*rr));}
 S.add(new T.Line(new T.BufferGeometry().setFromPoints(pts),netMat));}
const ballR=0.12;
const ballTex=cv(512,256,(x,w,h)=>{x.fillStyle='#c45a18';x.fillRect(0,0,w,h);
 x.strokeStyle='#1a120c';x.lineWidth=10;x.beginPath();x.moveTo(w/2,0);x.lineTo(w/2,h);x.stroke();
 x.beginPath();x.ellipse(w/2,h/2,w*0.42,h*0.48,0,0,7);x.stroke(); x.beginPath();x.moveTo(0,h/2);x.lineTo(w,h/2);x.stroke();});
const ball=new T.Mesh(new T.SphereGeometry(ballR,28,20),std({map:ballTex,roughness:0.55})); ball.position.set(0.3,ballR,0.8); S.add(ball);
const B={m:ball,v:new T.Vector3(),held:null,rest:true,t:0,scored:false};
let score=0, streak=0, prizeGiven=false;
const maraLines=['Netter Wurf. Fast wie 89.','Swish. Die Straße hat es gehört.','Noch einer – dann glaub ich dir die Zeitreise.','Nicht schlecht für jemanden aus der Zukunft.'];
function mara(t){const el=document.getElementById('hud'); el.innerHTML=`Basketball-Hinterhof (1989)<br><small style="color:#ffb0d8">Mara: „${t}“</small>`; setTimeout(()=>{el.innerHTML='Basketball-Hinterhof (1989)<br><small>VR: L-Stick · Trigger-Teleport · R-Stick Snap · Grip Ball</small>';},4500);}
function setScore(n){score=n; document.getElementById('score').textContent=score; streak++; mara(maraLines[score%maraLines.length]);
 if(streak>=3&&!prizeGiven){ prizeGiven=true; const got=window.__loopClock.add(90); SND.bell(); if(got) SND.clock();
  document.getElementById('prize').style.display='block'; document.getElementById('prize').textContent=got?'🏀 Serie! +1:30 auf die Schleife':'🏀 Serie! (Zeitbonus schon verbraucht)';
  mara(got?'Drei hintereinander – ich schenk dir anderthalb Minuten.':'Drei hintereinander. Mehr Zeit gibt\'s diesmal nicht.');
  setTimeout(()=>{document.getElementById('prize').style.display='none';},4200);} }
// rig + locomotion
const rigEl=document.getElementById('rig'); const rig=rigEl.object3D; const cam=document.getElementById('cam').object3D;
const ctr=[{hand:'left'},{hand:'right'}];
['left','right'].forEach((hand,i)=>{
 const c=document.createElement('a-entity'); c.setAttribute('laser-controls',`hand:${hand}`);
 c.setAttribute('raycaster', hand==='left'?'objects:.floor; far:8; showLine:true':'enabled:false');
 sc.appendChild(c); ctr[i]={c:c.object3D, el:c, hist:[], held:null, hand};
 c.addEventListener('squeezestart',()=>grab(ctr[i])); c.addEventListener('squeezeend',()=>release(ctr[i]));
 c.addEventListener('triggerdown',()=>{ if(ctr[i].held){ release(ctr[i]); return; } if(hand==='left'||hand==='right') tryTeleport(ctr[i]); });
});
ground.userData.floor=true; ground.name='floor'; // mark for ray
function grab(st){ if(B.held||(!B.rest&&B.v.length()>0.5)) return; const p=new T.Vector3(); st.c.getWorldPosition(p);
 if(p.distanceTo(B.m.position)<0.32){ B.held=st; st.held=B; B.rest=false; B.scored=false; }}
function release(st){ if(st.held!==B) return; const hist=st.hist; let v=new T.Vector3();
 if(hist.length>=2){ const a=hist[hist.length-1], b=hist[0]; const dt=Math.max(0.016,(a.t-b.t)/1000); v.copy(a.p).sub(b.p).multiplyScalar(1.25/dt); }
 B.v.copy(v); if(B.v.length()<0.4) B.v.set(0,0,0); B.held=null; st.held=null; B.t=0; }
const tpMarker=new T.Mesh(new T.RingGeometry(0.18,0.26,24),new T.MeshBasicMaterial({color:0x7ec8ff,transparent:true,opacity:0.7,side:T.DoubleSide}));
tpMarker.rotation.x=-Math.PI/2; tpMarker.visible=false; S.add(tpMarker);
function tryTeleport(st){ const o=new T.Vector3(),q=new T.Quaternion(); st.c.getWorldPosition(o); st.c.getWorldQuaternion(q);
 const dir=new T.Vector3(0,0,-1).applyQuaternion(q); const rc=new T.Raycaster(o,dir,0.2,10);
 const hit=rc.intersectObject(ground)[0]; if(!hit) return; rig.position.x=hit.point.x; rig.position.z=hit.point.z; tpMarker.visible=false; noise(0.08,400,1,0.2); }
sc.canvas.addEventListener('click',()=>{ if(B.held) return; const o=new T.Vector3(); cam.getWorldPosition(o); const dir=new T.Vector3(0,0,-1).applyQuaternion(cam.getWorldQuaternion(new T.Quaternion()));
 B.m.position.copy(o).addScaledVector(dir,0.45); B.v.copy(dir).multiplyScalar(6.2).add(new T.Vector3(0,2.8,0)); B.rest=false; B.scored=false; B.t=0; streak=0; });
const GRAV=-9.81; let last=performance.now(); let snapArm=true;
function step(dt){
 if(B.held){ B.held.c.getWorldPosition(B.m.position); B.m.position.y-=0.05; return; }
 if(B.rest && B.v.length()<0.05){ B.v.set(0,0,0); return; }
