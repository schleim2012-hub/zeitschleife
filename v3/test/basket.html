function noise(dur,f,q,g,type='bandpass'){const a=ac(),n=a.createBuffer(1,a.sampleRate*dur,a.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.2);
 const s=a.createBufferSource();s.buffer=n;const bf=a.createBiquadFilter();bf.type=type;bf.frequency.value=f;bf.Q.value=q;const gn=a.createGain();gn.gain.value=g;s.connect(bf);bf.connect(gn);gn.connect(a.destination);s.start();}
function tone(f,dur,g,type='sine',f2){const a=ac(),o=a.createOscillator(),gn=a.createGain(),t=a.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(gn);gn.connect(a.destination);o.start(t);o.stop(t+dur);}

 clock:()=>{const a=ac(),t0=a.currentTime;for(let i=0;i<7;i++){const t=t0+i*0.45;const o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();o.type='square';o.frequency.value=i%2?920:780;f.type='bandpass';f.frequency.value=1100;f.Q.value=4;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.035,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+0.07);o.connect(f);f.connect(g);g.connect(a.destination);o.start(t);o.stop(t+0.09);}},

const backM=new T.MeshBasicMaterial({color:0xffffff,fog:false,toneMapped:false,side:T.DoubleSide}); loader.load('../assets/pano/basket_back_360.jpg',t=>{t.colorSpace=T.SRGBColorSpace;t.anisotropy=8;backM.map=t;backM.needsUpdate=true;});
const BANG=2*Math.PI-WANG; const backWall=new T.Mesh(new T.CylinderGeometry(WR,WR,WH,160,1,true,Math.PI+WANG/2,BANG),backM); backWall.scale.x=-1; backWall.position.copy(wall.position); S.add(backWall);
if(window.baseFog) baseFog(S,{R:WR,cx:0,cz:2.2,thL:2*Math.PI,h:0.8,ring:2.2,color:0x050304,opacity:0.8}); // kaschiert die gebogene Wandkante
if(window.worldDust) worldDust(sc,{count:55,rMin:1.0,rMax:4.0,yMin:0.4,yMax:3.4,color:0xffd6a0,color2:0xff9f60,opacity:0.38}); // Hallenstaub im Scheinwerferlicht – weltfest, nicht am Kopf
// Matte-Painting-Übergang: 3D-Boden blendet zur Fotowand hin aus, dahinter liegt der nasse Foto-Boden (unter y=0 auf dem Bogen)
(()=>{ const N=512, c=document.createElement('canvas'); c.width=c.height=N; const x=c.getContext('2d'), id=x.createImageData(N,N);
 for(let j=0;j<N;j++) for(let i=0;i<N;i++){ const wx=(i/N-0.5)*24, wz=(j/N-0.5)*24; /* Kreis liegt flach: v nach unten = +z */ const dz=wz-2.2, r=Math.hypot(wx,dz), ang=Math.atan2(wx,-dz);
  let a=1; { const d=WR-r, edge=1; /* rundum: 3D-Boden blendet überall zum Fotoboden aus */ const t=Math.min(1,Math.max(0,(d-0.25)/1.9)); a=1-(1-t*t*(3-2*t))*edge; }
  const k=(j*N+i)*4; id.data[k]=id.data[k+1]=id.data[k+2]=Math.round(a*255); id.data[k+3]=255; }
 x.putImageData(id,0,0); const am=new T.CanvasTexture(c); ground.material.alphaMap=am; ground.material.transparent=true; ground.material.depthWrite=true; ground.material.needsUpdate=true; })();
// thin dark edge under wall so hoop mount reads solid

  const m=std({color:0x8a6238,roughness:0.85,map:null}); const b=new T.Mesh(new T.BoxGeometry(0.55*s,0.5*s,0.55*s),m); b.position.y=0.25*s; g.add(b);
  for(const [ox,oy,oz,sx,sy,sz] of [[0,0.26*s,0,0.58*s,0.04*s,0.58*s],[0,0.02,0,0.58*s,0.04*s,0.58*s]]){ const sl=new T.Mesh(new T.BoxGeometry(sx,sy,sz),std({color:0x6a4a28,roughness:0.9})); sl.position.set(ox,oy,oz); g.add(sl);} return g; }

  const rim=new T.Mesh(new T.TorusGeometry(0.3,0.025,8,24),std({color:0x222226,metalness:0.7,roughness:0.4})); rim.rotation.x=Math.PI/2; rim.position.y=0.92; g.add(rim);

  for(const y of [0.35,0.85]){ const r=new T.Mesh(new T.BoxGeometry(0.04,0.05,len),std({color:0x4a4034,roughness:0.85})); r.position.y=y; g.add(r);} }


 /* fences hidden — photo world */

 x.fillStyle=g; x.fillRect(0,0,w,h); for(let i=0;i<80;i++){ const bx=Math.random()*w, bw=8+Math.random()*30, bh=20+Math.random()*90; x.fillStyle='#0c1428'; x.fillRect(bx,h-bh,bw,bh);
  for(let k=0;k<8;k++){ x.fillStyle=`rgba(255,${180+Math.random()*60},${80},${0.3+Math.random()*0.5})`; x.fillRect(bx+2+Math.random()*(bw-4), h-bh+4+Math.random()*(bh-10), 2, 2);} }
 x.fillStyle='rgba(255,160,80,0.25)'; x.fillRect(0,h*0.7,w,h*0.3); });
const cityM=new T.Mesh(new T.PlaneGeometry(40,8),new T.MeshBasicMaterial({map:city,toneMapped:false,transparent:true,opacity:0.85})); cityM.position.set(0,3.2,-18); /* old procedural skyline removed — photo sphere */
const wallWarm=new T.PointLight(0xffa860,0.0,5,2); wallWarm.position.set(-2.4,3.2,-3.6); S.add(wallWarm); const wallFill=new T.PointLight(0xffb070,0.0,10,2); wallFill.position.set(0.3,2.6,-2.0); S.add(wallFill); const hoopFill=new T.PointLight(0xffd0a0,0.9,7,2); hoopFill.position.set(0,3.0,-2.5); S.add(hoopFill);

// streetlight with cone + moths/dust

const lampL=new T.PointLight(0xffc080,2.2,10,1.8); lampL.position.copy(lamp.position); S.add(lampL);

const dustG=new T.BufferGeometry(); dustG.setAttribute('position',new T.BufferAttribute(dustPos,3));

const ballR=0.12;

// ===== Physik (cannon-es, feste 1/240-s-Schritte) – siehe zeitschleife_vr_physik_tipps.md =====

// Rückprall (Literatur): Hallenboden 0,82–0,88 (FIBA-Fallprobe), Asphalt etwas weniger; Glasbrett ~0,7–0,78; Stahlring 0,5–0,65
CMt(mBall,mFloor,0.65,0.73); CMt(mBall,mBoard,0.35,0.72); CMt(mBall,mRim,0.25,0.58); CMt(mBall,mHand,0.9,0.2); CMt(mBall,mWall,0.5,0.55);
function stat(shape,mat,x,y,z,q){ const b=new C.Body({mass:0,material:mat}); b.addShape(shape); b.position.set(x,y,z); if(q) b.quaternion.copy(q); world.addBody(b); return b; }
const qPlane=(ax,ang)=>{ const q=new C.Quaternion(); q.setFromAxisAngle(ax,ang); return q; };
const floorB=stat(new C.Plane(),mFloor,0,0,0,qPlane(new C.Vec3(1,0,0),-Math.PI/2));
stat(new C.Plane(),mWall,0,0,-5.12); // Hauswand hinter dem Brett
stat(new C.Plane(),mWall,0,0,6.5,qPlane(new C.Vec3(0,1,0),Math.PI)); stat(new C.Plane(),mWall,-6.5,0,0,qPlane(new C.Vec3(0,1,0),Math.PI/2)); stat(new C.Plane(),mWall,6.5,0,0,qPlane(new C.Vec3(0,1,0),-Math.PI/2));
const boardB=stat(new C.Box(new C.Vec3(0.91,0.625,0.035)),mBoard,0,2.835,-5.0);
const rimBodies=[]; const RIMN=28; for(let i=0;i<RIMN;i++){ const a=i/RIMN*Math.PI*2; rimBodies.push(stat(new C.Sphere(0.021),mRim,Math.cos(a)*rimR,rimY,rimZ+Math.sin(a)*rimR)); }
stat(new C.Box(new C.Vec3(0.05,0.015,0.04)),mRim,0,rimY,-4.925); // Halterung Ring→Brett
const ballB=new C.Body({mass:0.6,material:mBall,linearDamping:0.015,angularDamping:0.06,allowSleep:true,sleepSpeedLimit:0.12,sleepTimeLimit:0.8});
ballB.addShape(new C.Sphere(ballR)); ballB.position.set(0.3,ballR,0.8); world.addBody(ballB);
const B={m:ball,body:ballB,held:null,scored:false,t:0,lastThrow:null,prevY:ballR,thrownBy:null,
 get v(){ return new T.Vector3(ballB.velocity.x,ballB.velocity.y,ballB.velocity.z); }, get rest(){ return ballB.sleepState===C.Body.SLEEPING; }};
let score=0, streak=0, prizeGiven=false;
const maraLines=['Netter Wurf. Fast wie 89.','Swish. Die Straße hat es gehört.','Noch einer – dann glaub ich dir die Zeitreise.','Nicht schlecht für jemanden aus der Zukunft.'];
function mara(t){const el=document.getElementById('hud'); el.innerHTML=`Basketball-Hinterhof (1989)<br><small style="color:#ffb0d8">Mara: „${t}“</small>`; setTimeout(()=>{el.innerHTML='Basketball-Hinterhof (1989)<br><small>VR: L-Stick · Trigger-Teleport · R-Stick Snap · Grip Ball</small>';},4500);}
function setScore(n){score=n; document.getElementById('score').textContent=score; streak++; mara(maraLines[score%maraLines.length]);
 if(streak>=3&&!prizeGiven){ prizeGiven=true; const got=window.__loopClock.add(90); SND.bell(); if(got) SND.clock();
  document.getElementById('prize').style.display='block'; document.getElementById('prize').textContent=got?'🏀 Serie! +1:30 auf die Schleife':'🏀 Serie! (Zeitbonus schon verbraucht)';
  mara(got?'Drei hintereinander – ich schenk dir anderthalb Minuten.':'Drei hintereinander. Mehr Zeit gibt\'s diesmal nicht.');
  setTimeout(()=>{document.getElementById('prize').style.display='none';},4200);} }
// Aufprall-Sounds + Haptik
ballB.addEventListener('collide',e=>{ const iv=Math.abs(e.contact.getImpactVelocityAlongNormal()); const o=e.body;
 if(o===floorB){ if(iv>0.6) SND.bounce(Math.min(1,iv/6)); }
 else if(rimBodies.includes(o)){ if(iv>0.25){ SND.rim(); B.rimHit=(B.rimHit||0)+1; } }
 else if(o===boardB){ if(iv>0.4) SND.thud(Math.min(1,iv/5)); }
 else if(o.material===mHand){ const st=ctr.find(s=>s.body===o); if(st) VR.haptic(R,st.hand,Math.min(1,0.2+iv/4),25); if(iv>0.6) SND.bounce(Math.min(0.6,iv/8)); }
 else if(o.material===mWall){ if(iv>0.6) SND.thud(Math.min(1,iv/6)); } });
// rig + locomotion
const rigEl=document.getElementById('rig'); const rig=rigEl.object3D; const cam=document.getElementById('cam').object3D;
const ctr=[];
['left','right'].forEach((hand,i)=>{
 const c=document.createElement('a-entity'); c.setAttribute('laser-controls',`hand:${hand}`);
 c.setAttribute('raycaster', hand==='left'?'objects:.floor; far:8; showLine:true':'enabled:false');
 rigEl.appendChild(c); // Controller MÜSSEN im selben Rig wie die Kamera hängen, sonst sitzen die Hände um den Rig-Versatz (2,2 m + Teleport) daneben
 // Hand als kinematischer Kollider (Bonelab-Idee: Hände gehen nicht durch den Ball, man kann ihn anstoßen/dribbeln)
 const hb=new C.Body({mass:0,type:C.Body.KINEMATIC,material:mHand,allowSleep:false}); hb.addShape(new C.Sphere(0.045)); hb.position.set(0,-10,0); hb.collisionResponse=false; world.addBody(hb);
 ctr[i]={c:c.object3D, el:c, tr:new VR.Tracker(), held:null, hand, body:hb, prev:new T.Vector3(0,-10,0), tgt:new T.Vector3(0,-10,0), off:new T.Vector3(), qOff:new T.Quaternion(), noHitUntil:0};
 c.addEventListener('squeezestart',()=>grab(ctr[i])); c.addEventListener('squeezeend',()=>release(ctr[i]));
 c.addEventListener('triggerdown',()=>{ if(ctr[i].held){ release(ctr[i]); return; } tryTeleport(ctr[i]); });
});
ground.userData.floor=true; ground.name='floor';
const lagP=new T.Vector3(), lagV=new T.Vector3();
function ctrPose(st){ const p=new T.Vector3(), q=new T.Quaternion(); st.c.getWorldPosition(p); st.c.getWorldQuaternion(q); return {p,q}; }
function grab(st){ if(B.held&&B.held!==st&&!B.second){ const {p,q}=ctrPose(st); const bp=new T.Vector3().copy(ballB.position); if(p.distanceTo(bp)>ballR+0.22) return; // zweite Hand: Ball wird zwischen beiden Händen gehalten
   st.off.copy(bp.clone().sub(p)).applyQuaternion(q.clone().invert()); B.second=st; st.held=B; st.body.collisionResponse=false; VR.haptic(R,st.hand,0.35,30); return; }
 if(B.held) return; const {p,q}=ctrPose(st); const bp=new T.Vector3().copy(ballB.position);
 if(p.distanceTo(bp)>ballR+0.22){ // außer Reichweite → „Gravity Gloves“ (Alyx): zeigt der Controller grob auf den Ball, fliegt er in die Hand
   const dir=new T.Vector3(0,0,-1).applyQuaternion(q), to=bp.clone().sub(p), dist=to.length();
   const ang=Math.acos(Math.min(1,Math.max(-1,dir.dot(to.clone().normalize())))); const down=Math.acos(Math.min(1,Math.max(-1,new T.Vector3(0,-1,0).dot(to.clone().normalize()))));
   if(dist<9&&(ang<0.35||(down<0.6&&dist<2.2))){ const tf=Math.max(0.35,Math.min(0.75,dist*0.11)); const v=p.clone().sub(bp).divideScalar(tf); v.y+=0.5*9.81*tf;
     ballB.type=C.Body.DYNAMIC; ballB.wakeUp(); ballB.velocity.set(v.x,v.y,v.z); ballB.angularVelocity.set(0,0,0); B.pullBy=st; B.pullT=performance.now(); st.wantGrab=true; VR.haptic(R,st.hand,0.25,25); SND.bounce&&SND.bounce(0.2); }
   return; }
 const dir=bp.clone().sub(p); if(dir.length()<1e-3) dir.set(0,-1,0); dir.setLength(ballR+0.025); // Ball sitzt an der Handfläche, nicht im Controller
 st.off.copy(dir).applyQuaternion(q.clone().invert()); st.qOff.copy(q.clone().invert().multiply(ball.quaternion));
 B.held=st; st.held=B; B.scored=false; B.rimHit=0; ballB.type=C.Body.KINEMATIC; ballB.wakeUp(); ballB.velocity.set(0,0,0); ballB.angularVelocity.set(0,0,0);
 lagP.copy(bp); lagV.set(0,0,0); st.body.collisionResponse=false; VR.haptic(R,st.hand,0.45,35); }
function release(st){ st.wantGrab=false; if(B.pullBy===st) B.pullBy=null; if(st.held!==B) return; const {p}=ctrPose(st); const off=new T.Vector3().copy(ballB.position).sub(p);
 const est=st.tr.estimate(off,{stepBack:1,tangential:0.6,scale:1.06,max:16});
 if(B.second){ const other=st===B.second?B.held:B.second; st.held=null; B.second=null; B.held=other; const op=ctrPose(other); other.off.copy(new T.Vector3().copy(ballB.position).sub(op.p)).applyQuaternion(op.q.clone().invert()); other.qOff.copy(op.q.clone().invert().multiply(ball.quaternion));
   B.pendingRel={v:est.v.clone(),w:est.w.clone(),t:performance.now()}; st.noHitUntil=performance.now()+180; return; }
 if(B.pendingRel&&performance.now()-B.pendingRel.t<150){ est.v.add(B.pendingRel.v).multiplyScalar(0.5); est.w.add(B.pendingRel.w).multiplyScalar(0.5); est.speed=est.v.length(); B.twoHand=true; } else B.twoHand=false; B.pendingRel=null;
 ballB.type=C.Body.DYNAMIC; ballB.mass=0.6; ballB.updateMassProperties(); ballB.wakeUp();
 ballB.velocity.set(est.v.x,est.v.y,est.v.z); ballB.angularVelocity.set(est.w.x*0.5,est.w.y*0.5,est.w.z*0.5);
 if(est.speed<0.25) ballB.velocity.set(0,0,0);
 B.held=null; st.held=null; B.t=0; B.thrownBy=st; B.lastThrow={v:est.v.toArray().map(x=>+x.toFixed(2)),w:est.w.toArray().map(x=>+x.toFixed(2)),n:st.tr.s.length};
 st.noHitUntil=performance.now()+180; VR.haptic(R,st.hand,0.12,12); }
const tpMarker=new T.Mesh(new T.RingGeometry(0.18,0.26,24),new T.MeshBasicMaterial({color:0x7ec8ff,transparent:true,opacity:0.7,side:T.DoubleSide}));
tpMarker.rotation.x=-Math.PI/2; tpMarker.visible=false; S.add(tpMarker);
function tryTeleport(st){ const o=new T.Vector3(),q=new T.Quaternion(); st.c.getWorldPosition(o); st.c.getWorldQuaternion(q);
 const dir=new T.Vector3(0,0,-1).applyQuaternion(q); const rc=new T.Raycaster(o,dir,0.2,10);
 const hit=rc.intersectObject(ground)[0]; if(!hit) return; rig.position.x=hit.point.x; rig.position.z=hit.point.z; tpMarker.visible=false; noise(0.08,400,1,0.2); }
// Desktop: Klick = Wurf; schaut man grob zum Korb, wird die Flugbahn passend gerechnet (±4 % Streuung → trifft nicht immer)
function desktopThrow(){ if(B.held) return; const o=new T.Vector3(); cam.getWorldPosition(o); const q=cam.getWorldQuaternion(new T.Quaternion()); const dir=new T.Vector3(0,0,-1).applyQuaternion(q);
 const start=o.clone().addScaledVector(dir,0.45); start.y-=0.15; const tgt=new T.Vector3(0,rimY+0.02,rimZ); const hz=new T.Vector3(tgt.x-start.x,0,tgt.z-start.z); const d=hz.length(), h=tgt.y-start.y;
 const fl=new T.Vector3(dir.x,0,dir.z).normalize(); let v;
 if(fl.dot(hz.clone().normalize())>0.97&&d>0.8){ const th=52*Math.PI/180; const v2=9.81*d*d/(2*Math.cos(th)**2*(d*Math.tan(th)-h)); const sp=Math.sqrt(Math.max(1,v2))*(1+(Math.random()-0.5)*0.08);
   v=hz.normalize().multiplyScalar(sp*Math.cos(th)); v.y=sp*Math.sin(th); }
 else v=dir.clone().multiplyScalar(6.2).add(new T.Vector3(0,2.8,0));
 ballB.type=C.Body.DYNAMIC; ballB.wakeUp(); ballB.position.set(start.x,start.y,start.z); ballB.velocity.set(v.x,v.y,v.z); ballB.angularVelocity.set(-fl.z*7,0,fl.x*7); /* Rückwärtsdrall: ω = Flugrichtung × oben */
 B.scored=false; B.rimHit=0; B.t=0; streak=0; }
sc.canvas.addEventListener('click',desktopThrow);
const GRAV=-9.81; let last=performance.now(); let snapArm=true; const physStep=VR.stepper(1/240);
function respawn(){ const p=new T.Vector3(); cam.getWorldPosition(p); const f=new T.Vector3(0,0,-1).applyQuaternion(cam.getWorldQuaternion(new T.Quaternion())); f.y=0; f.normalize();
 ballB.type=C.Body.DYNAMIC; ballB.position.set(p.x+f.x*0.7,0.6,p.z+f.z*0.7); ballB.velocity.set(0,0,0); ballB.angularVelocity.set(0,0,0); ballB.wakeUp(); B.t=0; B.scored=false; }
function physFrame(dt,now){ const pres=R.xr.isPresenting;
 for(const st of ctr){ const {p,q}=ctrPose(st); st.tr.push(p,q,now/1000);
  const live=pres&&p.lengthSq()>1e-6; st.prev.copy(st.body.position); st.tgt.copy(live?p:new T.Vector3(0,-10,0));
  st.body.collisionResponse=live&&!st.held&&now>st.noHitUntil; st.pose={p,q};
  const d=st.tgt.clone().sub(st.prev); if(d.length()>0.28||dt<=0){ /* Snap-Back: Physik-Hand >28 cm vom Controller → sofort zurück */ st.body.position.set(st.tgt.x,st.tgt.y,st.tgt.z); st.body.velocity.set(0,0,0); } else st.body.velocity.set(d.x/dt,d.y/dt,d.z/dt); }
 if(B.pullBy&&!B.held){ const st=B.pullBy, hp=st.pose.p, bp=new T.Vector3().copy(ballB.position); if(st.wantGrab&&hp.distanceTo(bp)<ballR+0.2){ B.pullBy=null; grab(st); } else if(performance.now()-B.pullT>1500) B.pullBy=null; }
 if(B.held){ const st=B.held, tgt=st.off.clone().applyQuaternion(st.pose.q).add(st.pose.p); if(B.second&&B.second.pose){ const s2=B.second; tgt.add(s2.off.clone().applyQuaternion(s2.pose.q).add(s2.pose.p)).multiplyScalar(0.5); } B.target=tgt; }
 const n=physStep(dt,h=>{
  // Hand-Kollider: kinematisch, Geschwindigkeit = Handweg/Frame → überträgt Impuls auf den Ball
  if(B.held&&B.target){ VR.lagFollow(lagP,lagV,B.target,B.second?0.3:0.6,h); ballB.position.set(lagP.x,lagP.y,lagP.z); ballB.velocity.set(lagV.x,lagV.y,lagV.z); }
  const y0=ballB.position.y; world.step(h);
  // Korb: Ballmitte kreuzt die Ringebene von oben, innerhalb des Rings
  const P=ballB.position; if(!B.held&&!B.scored&&y0>=rimY&&P.y<rimY&&ballB.velocity.y<0&&Math.hypot(P.x,P.z-rimZ)<rimR-0.035){ B.scored=true; setScore(score+1); SND.swish(); if(B.thrownBy){ const hh=B.thrownBy.hand; VR.haptic(R,hh,0.35,40); setTimeout(()=>VR.haptic(R,hh,0.5,60),120); } }
 });
 ball.position.set(ballB.position.x,ballB.position.y,ballB.position.z);
 if(B.held) ball.quaternion.copy(B.held.pose.q).multiply(B.held.qOff); else ball.quaternion.set(ballB.quaternion.x,ballB.quaternion.y,ballB.quaternion.z,ballB.quaternion.w);
 if(!B.held){ B.t+=dt; const P=ballB.position; if(P.y<-1||Math.hypot(P.x,P.z)>16) respawn(); if(B.rest&&B.t>2&&!B.scored) streak=streak; }
 return n; }
AFRAME.registerComponent('basket-tick',{tick(){ const now=performance.now(),dt=Math.min(0.05,(now-last)/1000); last=now;
 // controllers hist + teleport preview + stick move/turn
 for(const st of ctr){
  const gp=st.el.components['tracked-controls']||st.el.components['tracked-controls-webxr'];
  const src=st.el.components['laser-controls'];
 }
 // XR gamepads
 const sess=R.xr.getSession&&R.xr.getSession();
 if(sess){ for(const src of sess.inputSources||[]){ const gp=src.gamepad; if(!gp||!gp.axes) continue;
   if(src.handedness==='left'){ // move
     const ax=gp.axes[2]!==undefined?gp.axes[2]:gp.axes[0], ay=gp.axes[3]!==undefined?gp.axes[3]:gp.axes[1];
     if(Math.hypot(ax,ay)>0.15){ const q=cam.getWorldQuaternion(new T.Quaternion()); const f=new T.Vector3(0,0,-1).applyQuaternion(q); f.y=0; f.normalize();
      const r=new T.Vector3(1,0,0).applyQuaternion(q); r.y=0; r.normalize();
      rig.position.addScaledVector(f,-ay*2.6*dt); rig.position.addScaledVector(r,ax*2.6*dt); }
   }
   if(src.handedness==='right'){ // snap turn
     const ax=gp.axes[2]!==undefined?gp.axes[2]:gp.axes[0];
     if(Math.abs(ax)>0.7 && snapArm){ rig.rotation.y -= Math.sign(ax)*(Math.PI/6); snapArm=false; }
     if(Math.abs(ax)<0.3) snapArm=true;
   }
 }}
 // teleport marker on aiming
 for(const st of ctr){ if(st.held) continue; const o=new T.Vector3(),q=new T.Quaternion(); st.c.getWorldPosition(o); st.c.getWorldQuaternion(q);
  const dir=new T.Vector3(0,0,-1).applyQuaternion(q); const hit=new T.Raycaster(o,dir,0.2,10).intersectObject(ground)[0];
  if(hit){ tpMarker.position.copy(hit.point); tpMarker.position.y=0.02; tpMarker.visible=true; break; } else tpMarker.visible=false; }
 physFrame(dt,now);
 lampL.intensity=4.5+Math.sin(now*0.008)*0.15+Math.random()*0.05;
 // moths swirl
 const da=dust.geometry.attributes.position; for(let i=0;i<da.count;i++){ let x=da.getX(i)+Math.sin(now*0.002+i)*0.004; let y=da.getY(i)+Math.sin(now*0.003+i*1.7)*0.006; let z=da.getZ(i)+Math.cos(now*0.0025+i)*0.004;
  if(y>3.8) y=0.4; da.setXYZ(i,x,y,z);} da.needsUpdate=true;
}});
sc.setAttribute('basket-tick','');
window.__b={B,world,ballB,ctr,physFrame,grab,release,desktopThrow,respawn,rimY,rimZ,rimR,get score(){return score},streak:()=>streak,get clock(){return window.__loopClock},setScore};
});
