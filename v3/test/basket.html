const BALLS=[];

const maraLines=['Netter Wurf. Fast wie 89.','Swish. Die Straße hat es gehört.','Noch einer – dann glaub ich dir die Zeitreise.','Nicht schlecht für jemanden aus der Zukunft.'];

function desktopThrow(){ const B=BALLS.find(b=>!b.it.heldBy&&!b.it.pulling&&!b.it.thrown)||BALLS.find(b=>!b.it.heldBy); if(!B) return; const ballB=B.body; const o=new T.Vector3(); cam.getWorldPosition(o); const q=cam.getWorldQuaternion(new T.Quaternion()); const dir=new T.Vector3(0,0,-1).applyQuaternion(q);
 const start=o.clone().addScaledVector(dir,0.45); start.y-=0.15; const tgt=new T.Vector3(0,rimY+0.02,rimZ); const hz=new T.Vector3(tgt.x-start.x,0,tgt.z-start.z); const d=hz.length(), h=tgt.y-start.y;

 B.scored=false; B.missed=false; B.it.thrown=true; B.it.idleT=0; B.it.thrownBy=null; attempts++; drawBoard(); }
