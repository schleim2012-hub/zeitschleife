<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Spielhalle · 1984</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script><script src="lib/alpha.js?v=11"></script><script src="lib/arc3d.js?v=5"></script><script src="lib/zf.js?v=4"></script><script src="lib/f3d.js?v=2"></script>
<style>#hud{position:fixed;left:12px;top:10px;z-index:5;color:#e8f0e8;font:600 14px/1.35 sans-serif;background:rgba(0,0,0,.5);padding:8px 12px;border-radius:10px;max-width:470px}
#sub{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:6;color:#fff;font:600 17px sans-serif;text-shadow:0 0 8px #000;background:rgba(0,0,0,.5);padding:6px 14px;border-radius:8px;display:none;max-width:80%;text-align:center}</style></head><body>
<div id="hud"><b>Spielhalle · 1984</b><br>VR: L-Stick gehen · R-Stick drehen · Laser+Trigger = Gegenstand nehmen/ablegen<br>Desktop: WASD · Klick = nehmen · ZEIT-FRESSER / FORUM 3D: Bildschirm anklicken (Pfeiltasten, Leertaste = Banane)</div>
<div id="sub"></div>
<a-scene renderer="colorManagement:true; antialias:true; foveationLevel:0.2" webxr="referenceSpaceType:local-floor" fog="type:exponential; color:#0c0814; density:0.075" light="defaultLightsEnabled:false" background="color:#050308" cursor="rayOrigin:mouse" raycaster="objects:.clickable">
 <a-entity id="rig" room-move>
  <a-camera id="cam" position="0 1.6 0" wasd-controls="acceleration:18"></a-camera>
  <a-entity id="hl" laser-controls="hand:left" raycaster="objects:.clickable; far:6"></a-entity>
  <a-entity id="hr" laser-controls="hand:right" raycaster="objects:.clickable; far:6"></a-entity>
 </a-entity>
</a-scene>
<script src="era_arcade_cfg.js?v=5"></script>
<script src="era_amb.js?v=1"></script><script src="era_room.js?v=22"></script><script src="era_extras.js?v=6"></script></body></html>
