<style>@font-face{font-family:"Kalam";src:url(../fonts/Kalam-Regular.ttf)}
#hud{position:fixed;left:12px;top:10px;z-index:5;color:#e8d8b8;font:600 14px/1.35 sans-serif;background:rgba(0,0,0,.5);padding:8px 12px;border-radius:10px;max-width:480px}</style></head><body>
<div id="hud"><b>Wohnung</b> · Schlafzimmer ↔ Küche ↔ Wohnzimmer ↔ Büro<br>VR: L-Stick gehen · R-Stick drehen · Laser+Trigger benutzen · Grip greifen · Trigger bricht die Tür-Überblendung ab<br>Desktop: WASD · Maus ziehen · Klick = benutzen/nehmen</div>
<a-scene apt-world renderer="colorManagement:true; antialias:true; foveationLevel:0.2" webxr="referenceSpaceType:local-floor"
 fog="type:exponential; color:#050404; density:0.05" background="color:#000" light="defaultLightsEnabled:false" cursor="rayOrigin:mouse" raycaster="objects:.clickable">
 <a-entity id="rig">
  <a-camera id="cam" position="0 1.6 0" wasd-controls="acceleration:18"></a-camera>
  <a-entity id="hl" laser-controls="hand:left" raycaster="objects:.clickable; far:6; lineOpacity:0.35"></a-entity>
  <a-entity id="hr" laser-controls="hand:right" raycaster="objects:.clickable; far:6; lineOpacity:0.35"></a-entity>
 </a-entity>
</a-scene>
