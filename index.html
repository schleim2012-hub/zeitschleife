<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><title>Zeitschleife</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>#hud{position:fixed;top:8px;left:8px;z-index:9;color:#ff9;font:16px monospace;background:#0008;padding:6px}</style></head>
<body><div id="hud">Zeitschleife – Maus: klicken &amp; ziehen. Quest: "VR" unten rechts.</div>
<a-scene renderer="colorManagement:true" cursor="rayOrigin:mouse" raycaster="objects:.click">
<a-assets><img id="backrooms" src="img/backrooms.jpg"><img id="pool" src="img/pool1984.jpg"><img id="fest" src="img/festival1972.jpg"></a-assets>
<a-sky id="sky" src="#backrooms" radius="60"></a-sky>
<a-entity id="hs"></a-entity>
<a-entity id="dlg" position="0 1.6 -2.2" visible="false">
 <a-plane class="click" id="dlgbg" width="2.6" height="1.3" color="#120818" opacity="0.88"></a-plane>
 <a-text id="dlgtxt" value="" width="2.4" wrap-count="46" color="#ffe9a8" position="-1.2 0.15 0.01" anchor="left"></a-text>
 <a-entity id="choices" position="0 -0.45 0.02"></a-entity>
</a-entity>
<a-text id="inv" value="Inventar: -" position="-1.3 0.6 -2.2" width="2.5" color="#9ff"></a-text>
<a-entity id="fade" geometry="primitive:sphere;radius:0.5" material="color:#000;side:back;opacity:0;transparent:true" position="0 1.6 0"></a-entity>
<a-entity camera look-controls position="0 1.6 0"></a-entity>
<a-entity laser-controls="hand:right" raycaster="objects:.click;far:80"></a-entity>
<a-entity laser-controls="hand:left" raycaster="objects:.click;far:80"></a-entity>
</a-scene>
<script src="game.js"></script></body></html>
